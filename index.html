<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BloxPlay</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #101114;
    color: white;
    min-height: 100%;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    min-height: 100vh;
}

header {
    height: 64px;
    background: #181a20;
    border-bottom: 1px solid #292c35;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

nav {
    display: flex;
    gap: 6px;
    flex: 1;
}

nav button,
.header-button {
    background: transparent;
    color: #ddd;
    border: 0;
    padding: 10px 12px;
    border-radius: 8px;
}

nav button:hover,
.header-button:hover {
    background: #292c35;
    color: white;
}

.bux {
    background: #20242d;
    border: 1px solid #343946;
    border-radius: 10px;
    padding: 9px 12px;
    white-space: nowrap;
    font-weight: bold;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 24px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

h1 {
    margin-top: 0;
}

.search {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #343946;
    background: #191b21;
    color: white;
    outline: none;
    margin-bottom: 20px;
}

.search:focus {
    border-color: #777;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
}

.game-card {
    background: #191b21;
    border: 1px solid #292c35;
    border-radius: 14px;
    padding: 18px;
}

.game-icon {
    font-size: 48px;
    margin-bottom: 12px;
}

.game-card h3 {
    margin: 0 0 8px;
}

.game-card p {
    color: #aeb3bf;
    min-height: 42px;
}

.play {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: #fff;
    color: #111;
    font-weight: bold;
}

.panel {
    max-width: 500px;
    background: #191b21;
    border: 1px solid #292c35;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.input {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border-radius: 9px;
    border: 1px solid #343946;
    background: #111318;
    color: white;
}

.primary {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 0;
    border-radius: 9px;
    background: white;
    color: black;
    font-weight: bold;
}

.secondary {
    padding: 10px 14px;
    border: 1px solid #343946;
    border-radius: 9px;
    background: #20242d;
    color: white;
}

.account-result {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px;
    margin-top: 8px;
    background: #20232b;
    border-radius: 9px;
}

.muted {
    color: #aeb3bf;
}

#gameScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #111;
    display: none;
    overflow: hidden;
}

#gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#gameTop {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    min-height: 62px;
    z-index: 10;
    background: rgba(15,15,18,.92);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 12px;
}

#gameStats {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 14px;
}

#leaveGame {
    background: #c93636;
    border: 0;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: bold;
}

#controls {
    position: absolute;
    left: 15px;
    bottom: 20px;
    z-index: 20;
    touch-action: none;
}

.control-row {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.control {
    width: 58px;
    height: 58px;
    border-radius: 13px;
    border: 2px solid rgba(255,255,255,.45);
    background: rgba(20,20,20,.72);
    color: white;
    font-size: 22px;
    touch-action: none;
}

#gameHint {
    position: absolute;
    z-index: 20;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.65);
    padding: 10px 15px;
    border-radius: 9px;
    pointer-events: none;
}

@media(max-width:650px) {
    header {
        height: auto;
        min-height: 64px;
        flex-wrap: wrap;
        padding: 8px;
    }

    nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
    }

    main {
        padding: 16px;
    }

    #gameStats {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
    }

    #gameHint {
        bottom: 145px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="logo">🧱 BloxPlay</div>

    <nav>
        <button onclick="showPage('home')">Home</button>
        <button onclick="showPage('games')">Games</button>
        <button onclick="showPage('accounts')">Accounts</button>
        <button onclick="showPage('friends')">Friends</button>
    </nav>

    <div class="bux">
        💰 <span id="headerBux">0</span> BloxBux
    </div>
</header>

<main>

<section id="home" class="page active">
    <h1>Welcome to BloxPlay</h1>
    <p class="muted">Play games and earn BloxBux while you stay in them.</p>

    <input
        id="homeSearch"
        class="search"
        placeholder="Search games..."
        oninput="searchGames('homeSearch','homeGames')"
    >

    <div id="homeGames" class="games"></div>
</section>


<section id="games" class="page">
    <h1>Games</h1>

    <input
        id="gamesSearch"
        class="search"
        placeholder="Search games..."
        oninput="searchGames('gamesSearch','gamesList')"
    >

    <div id="gamesList" class="games"></div>
</section>


<section id="accounts" class="page">
    <h1>Accounts</h1>

    <div id="accountArea"></div>

    <div class="panel">
        <h2>Find People</h2>

        <input
            id="accountSearch"
            class="input"
            placeholder="Search username..."
            oninput="searchPeople()"
        >

        <div id="peopleResults"></div>
    </div>
</section>


<section id="friends" class="page">
    <h1>Friends</h1>

    <div class="panel">
        <p class="muted">
            Friends will appear here.
        </p>
    </div>
</section>

</main>
</div>


<div id="gameScreen">

    <div id="gameTop">
        <strong>🕵️ Mystery Hunt</strong>

        <div id="gameStats">
            <span>💰 <span id="gameBux">0</span> BloxBux</span>
            <span>⏱️ <span id="gameTime">00:00</span></span>
        </div>

        <button id="leaveGame" onclick="leaveGame()">
            Leave
        </button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="control-row">
            <button class="control" id="up">▲</button>
        </div>

        <div class="control-row">
            <button class="control" id="left">◀</button>
            <button class="control" id="down">▼</button>
            <button class="control" id="right">▶</button>
        </div>
    </div>

    <div id="gameHint">
        Drag the screen to look around
    </div>

</div>


<script type="module">

/*
==================================================
BLOXPLAY MAIN SYSTEM
Everything is inside this one index.html.
==================================================
*/


const STORAGE_ACCOUNTS = "bloxplayAccounts";
const STORAGE_CURRENT = "bloxplayCurrent";


const games = [
    {
        name: "Mystery Hunt",
        icon: "🕵️",
        description: "Explore a 3D map and find hidden clues.",
        tags: "mm2 mystery detective"
    },
    {
        name: "Brain Grab",
        icon: "🧠",
        description: "Collect characters and bring them back to your base.",
        tags: "sab collecting base"
    },
    {
        name: "Island Survival",
        icon: "🏝️",
        description: "Survive on a blocky island.",
        tags: "survival island"
    },
    {
        name: "Block Racers",
        icon: "🏎️",
        description: "Race through blocky tracks.",
        tags: "racing race cars"
    },
    {
        name: "Ghost Hunt",
        icon: "👻",
        description: "Search a mysterious map for ghosts.",
        tags: "ghost hunt"
    },
    {
        name: "Coin Rush",
        icon: "🪙",
        description: "Collect as many coins as you can.",
        tags: "coins simulator money"
    },
    {
        name: "Build City",
        icon: "🏙️",
        description: "Build your own block city.",
        tags: "building city"
    }
];


let THREE = null;

let renderer = null;
let scene = null;
let camera = null;
let player = null;

let animationFrame = null;
let gameInterval = null;
let bloxBuxInterval = null;

let gameStarted = 0;

const keys = {
    up: false,
    down: false,
    left: false,
    right: false
};


/*
==================================================
ACCOUNT SYSTEM
==================================================
*/

function getAccounts() {

    try {

        return JSON.parse(
            localStorage.getItem(STORAGE_ACCOUNTS) || "[]"
        );

    } catch {

        return [];

    }

}


function saveAccounts(accounts) {

    localStorage.setItem(
        STORAGE_ACCOUNTS,
        JSON.stringify(accounts)
    );

}


function getCurrentUsername() {

    return localStorage.getItem(
        STORAGE_CURRENT
    );

}


function setCurrentUsername(username) {

    localStorage.setItem(
        STORAGE_CURRENT,
        username
    );

}


function getCurrentAccount() {

    const username =
        getCurrentUsername();

    if (!username) {
        return null;
    }

    return getAccounts().find(
        account =>
            account.username.toLowerCase() ===
            username.toLowerCase()
    ) || null;

}


function createAccount(username, password) {

    username = username.trim();

    if (username.length < 3) {
        return "Username must be at least 3 characters.";
    }

    if (username.length > 20) {
        return "Username must be 20 characters or less.";
    }

    if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        return "Username can only use letters, numbers, and _.";
    }

    if (password.length < 6) {
        return "Password must be at least 6 characters.";
    }

    const accounts =
        getAccounts();

    const exists =
        accounts.some(
            account =>
                account.username.toLowerCase() ===
                username.toLowerCase()
        );

    if (exists) {
        return "That username already exists.";
    }

    accounts.push({
        username: username,
        password: password,
        bloxBux: 0,
        friends: [],
        avatar: {
            skin: "default",
            shirt: "default",
            pants: "default"
        }
    });

    saveAccounts(accounts);

    setCurrentUsername(username);

    updateAllBux();

    renderAccountArea();

    return null;

}


function login(username, password) {

    const account =
        getAccounts().find(
            item =>
                item.username.toLowerCase() ===
                username.trim().toLowerCase()
        );

    if (!account) {
        return "Account not found.";
    }

    if (account.password !== password) {
        return "Incorrect password.";
    }

    setCurrentUsername(
        account.username
    );

    updateAllBux();

    renderAccountArea();

    return null;

}


function logout() {

    localStorage.removeItem(
        STORAGE_CURRENT
    );

    updateAllBux();

    renderAccountArea();

}


function getBloxBux() {

    const account =
        getCurrentAccount();

    if (!account) {
        return 0;
    }

    return Number(
        account.bloxBux || 0
    );

}


function addBloxBux(amount) {

    const username =
        getCurrentUsername();

    if (!username) {
        return;
    }

    const accounts =
        getAccounts();

    const account =
        accounts.find(
            item =>
                item.username.toLowerCase() ===
                username.toLowerCase()
        );

    if (!account) {
        return;
    }

    account.bloxBux =
        Number(account.bloxBux || 0) +
        Number(amount);

    saveAccounts(accounts);

    updateAllBux();

}


/*
==================================================
ACCOUNT UI
==================================================
*/

function renderAccountArea() {

    const area =
        document.getElementById(
            "accountArea"
        );

    const account =
        getCurrentAccount();

    if (account) {

        area.innerHTML = `
            <div class="panel">
                <h2>👤 ${escapeHTML(account.username)}</h2>

                <p>
                    💰
                    <strong>
                        ${Number(account.bloxBux || 0).toLocaleString()}
                    </strong>
                    BloxBux
                </p>

                <button
                    class="secondary"
                    id="logoutButton"
                >
                    Log Out
                </button>
            </div>
        `;

        document
            .getElementById("logoutButton")
            .onclick = logout;

        return;
    }


    area.innerHTML = `
        <div class="panel">

            <h2>Create Account</h2>

            <input
                id="createUsername"
                class="input"
                placeholder="Username"
                maxlength="20"
            >

            <input
                id="createPassword"
                class="input"
                type="password"
                placeholder="Password"
                maxlength="100"
            >

            <button
                class="primary"
                id="createButton"
            >
                Create Account
            </button>

            <p
                id="createMessage"
                class="muted"
            ></p>

        </div>


        <div class="panel">

            <h2>Log In</h2>

            <input
                id="loginUsername"
                class="input"
                placeholder="Username"
            >

            <input
                id="loginPassword"
                class="input"
                type="password"
                placeholder="Password"
            >

            <button
                class="primary"
                id="loginButton"
            >
                Log In
            </button>

            <p
                id="loginMessage"
                class="muted"
            ></p>

        </div>
    `;


    document
        .getElementById("createButton")
        .onclick = () => {

            const username =
                document
                    .getElementById("createUsername")
                    .value;

            const password =
                document
                    .getElementById("createPassword")
                    .value;

            const message =
                createAccount(
                    username,
                    password
                );

            document
                .getElementById("createMessage")
                .textContent =
                    message ||
                    "Account created!";

        };


    document
        .getElementById("loginButton")
        .onclick = () => {

            const username =
                document
                    .getElementById("loginUsername")
                    .value;

            const password =
                document
                    .getElementById("loginPassword")
                    .value;

            const message =
                login(
                    username,
                    password
                );

            document
                .getElementById("loginMessage")
                .textContent =
                    message ||
                    "Logged in!";

        };

}


function searchPeople() {

    const search =
        document
            .getElementById("accountSearch")
            .value
            .trim()
            .toLowerCase();

    const results =
        document
            .getElementById("peopleResults");

    if (!search) {

        results.innerHTML = "";

        return;

    }

    const found =
        getAccounts().filter(
            account =>
                account.username
                    .toLowerCase()
                    .includes(search)
        );

    if (!found.length) {

        results.innerHTML =
            `<p class="muted">No accounts found.</p>`;

        return;

    }

    results.innerHTML =
        found.map(
            account => `
                <div class="account-result">
                    <strong>
                        👤 ${escapeHTML(account.username)}
                    </strong>
                    <span class="muted">
                        BloxPlay player
                    </span>
                </div>
            `
        ).join("");

}


/*
==================================================
GAME UI
==================================================
*/

function renderGames(
    searchText,
    containerId
) {

    const search =
        searchText
            .trim()
            .toLowerCase();

    const container =
        document.getElementById(
            containerId
        );

    const filtered =
        games.filter(
            game =>
                !search ||
                game.name.toLowerCase().includes(search) ||
                game.description.toLowerCase().includes(search) ||
                game.tags.toLowerCase().includes(search)
        );

    container.innerHTML =
        filtered.map(
            game => `
                <div class="game-card">

                    <div class="game-icon">
                        ${game.icon}
                    </div>

                    <h3>
                        ${escapeHTML(game.name)}
                    </h3>

                    <p>
                        ${escapeHTML(game.description)}
                    </p>

                    <button
                        class="play"
                        data-game="${escapeHTML(game.name)}"
                    >
                        Play
                    </button>

                </div>
            `
        ).join("");


    container
        .querySelectorAll(".play")
        .forEach(
            button => {

                button.onclick = () =>
                    launchGame(
                        button.dataset.game
                    );

            }
        );

}


function searchGames(
    inputId,
    containerId
) {

    renderGames(
        document
            .getElementById(inputId)
            .value,
        containerId
    );

}


function showPage(page) {

    document
        .querySelectorAll(".page")
        .forEach(
            section =>
                section.classList.remove("active")
        );

    const selected =
        document.getElementById(page);

    if (selected) {
        selected.classList.add("active");
    }

    if (page === "home") {

        renderGames(
            document.getElementById(
                "homeSearch"
            ).value,
            "homeGames"
        );

    }

    if (page === "games") {

        renderGames(
            document.getElementById(
                "gamesSearch"
            ).value,
            "gamesList"
        );

    }

    if (page === "accounts") {
        renderAccountArea();
    }

}


function updateAllBux() {

    const amount =
        getBloxBux();

    document
        .getElementById("headerBux")
        .textContent =
            amount.toLocaleString();

    document
        .getElementById("gameBux")
        .textContent =
            amount.toLocaleString();

}


/*
==================================================
REAL 3D GAME
==================================================
*/

async function loadThree() {

    if (THREE) {
        return THREE;
    }

    THREE =
        await import(
            "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
        );

    return THREE;

}


async function launchGame(gameName) {

    if (gameName !== "Mystery Hunt") {

        alert(
            gameName +
            " is coming soon."
        );

        return;

    }

    await startMysteryHunt();

}


async function startMysteryHunt() {

    cleanupGame();

    const T =
        await loadThree();

    document
        .getElementById("gameScreen")
        .style.display = "block";

    gameStarted =
        Date.now();

    updateAllBux();

    scene =
        new T.Scene();

    scene.background =
        new T.Color(0x83b5d9);

    scene.fog =
        new T.Fog(
            0x83b5d9,
            40,
            130
        );


    camera =
        new T.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.1,
            500
        );


    renderer =
        new T.WebGLRenderer({
            canvas:
                document.getElementById(
                    "gameCanvas"
                ),
            antialias: true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;


    /*
    LIGHTS
    */

    const skyLight =
        new T.HemisphereLight(
            0xffffff,
            0x405060,
            2
        );

    scene.add(skyLight);


    const sunlight =
        new T.DirectionalLight(
            0xffffff,
            2.2
        );

    sunlight.position.set(
        30,
        50,
        20
    );

    sunlight.castShadow = true;

    scene.add(sunlight);


    /*
    GROUND
    */

    const ground =
        new T.Mesh(
            new T.BoxGeometry(
                120,
                1,
                120
            ),
            new T.MeshStandardMaterial({
                color: 0x4f9148
            })
        );

    ground.position.y =
        -0.5;

    ground.receiveShadow =
        true;

    scene.add(ground);


    /*
    ROADS
    */

    const road =
        new T.Mesh(
            new T.BoxGeometry(
                12,
                0.06,
                120
            ),
            new T.MeshStandardMaterial({
                color: 0x444444
            })
        );

    road.position.y =
        0.03;

    scene.add(road);


    const road2 =
        new T.Mesh(
            new T.BoxGeometry(
                120,
                0.06,
                12
            ),
            new T.MeshStandardMaterial({
                color: 0x444444
            })
        );

    road2.position.y =
        0.04;

    scene.add(road2);


    /*
    BUILDINGS
    */

    function building(
        x,
        z,
        width,
        height,
        depth,
        color
    ) {

        const body =
            new T.Mesh(
                new T.BoxGeometry(
                    width,
                    height,
                    depth
                ),
                new T.MeshStandardMaterial({
                    color: color
                })
            );

        body.position.set(
            x,
            height / 2,
            z
        );

        body.castShadow = true;
        body.receiveShadow = true;

        scene.add(body);


        const roof =
            new T.Mesh(
                new T.BoxGeometry(
                    width + .5,
                    .5,
                    depth + .5
                ),
                new T.MeshStandardMaterial({
                    color: 0x303030
                })
            );

        roof.position.set(
            x,
            height + .25,
            z
        );

        roof.castShadow = true;

        scene.add(roof);

    }


    building(
        -24,
        -23,
        16,
        11,
        15,
        0xc96b6b
    );

    building(
        24,
        -23,
        16,
        15,
        15,
        0x6686c4
    );

    building(
        -24,
        23,
        16,
        9,
        15,
        0xc49a61
    );

    building(
        24,
        23,
        16,
        13,
        15,
        0x8065bd
    );


    /*
    PLAYER
    */

    player =
        new T.Group();

    player.position.set(
        0,
        0,
        35
    );

    scene.add(player);


    const body =
        new T.Mesh(
            new T.BoxGeometry(
                1.5,
                2,
                .85
            ),
            new T.MeshStandardMaterial({
                color: 0x3485d1
            })
        );

    body.position.y =
        1.4;

    DRAG TO LOOK
    */

    let looking = false;
    let lastX = 0;


    renderer.domElement
        .addEventListener(
            "pointerdown",
            event => {

                looking = true;
                lastX =
                    event.clientX;

            }
        );


    renderer.domElement
        .addEventListener(
            "pointermove",
            event => {

                if (!looking) {
                    return;
                }

                const movement =
                    event.clientX -
                    lastX;

                lastX =
                    event.clientX;

                player.rotation.y -=
                    movement * .008;

            }
        );


    renderer.domElement
        .addEventListener(
            "pointerup",
            () => {
                looking = false;
            }
        );

        .addEventListener(
