<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloxPlay</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav button {
      background: transparent;
      color: white;
      border: 0;
      margin: 0 4px;
      padding: 9px 10px;
      font-size: 15px;
      cursor: pointer;
    }

    nav button:hover {
      background: #333;
      border-radius: 8px;
    }

    .bux {
      background: #222;
      padding: 8px 12px;
      border-radius: 8px;
      color: #ffd83d;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 16px;
    }

    .hero {
      background: linear-gradient(135deg, #202020, #444);
      color: white;
      padding: 35px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .hero h1 {
      margin-top: 0;
      font-size: 38px;
    }

    .hero p {
      color: #ddd;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 25px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .game {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .game-icon {
      height: 120px;
      border-radius: 10px;
      background: linear-gradient(135deg, #777, #222);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      margin-bottom: 12px;
    }

    .game h3 {
      margin: 5px 0;
    }

    .game p {
      color: #666;
    }

    .play {
      width: 100%;
      padding: 11px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .play:hover {
      background: #333;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 700px) {
      header {
        flex-wrap: wrap;
        gap: 10px;
      }

      nav {
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
      }

      .hero h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🧱 BloxPlay</div>

  <nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('games')">Games</button>
    <button onclick="showPage('accounts')">Accounts</button>
    <button onclick="showPage('friends')">Friends</button>
  </nav>

  <div class="bux">
    💰 <span id="bux">0</span> BloxBux
  </div>
</header>

<main>

  <section id="home" class="page active">

    <div class="hero">
      <h1>Welcome to BloxPlay</h1>
      <p>Play games, make friends, create experiences, and earn BloxBux.</p>
    </div>

    <input
      class="search"
      id="homeSearch"
      placeholder="Search games..."
      oninput="searchGames('homeSearch','homeGames')"
    >

    <h2>🔥 Popular Games</h2>

    <div id="homeGames" class="games"></div>

  </section>


  <section id="games" class="page">

    <h1>Games</h1>

    <input
      class="search"
      id="gameSearch"
      placeholder="Search games..."
      oninput="searchGames('gameSearch','allGames')"
    >

    <div id="allGames" class="games"></div>

  </section>


  <section id="accounts" class="page">

    <h1>Accounts</h1>

    <div class="game">
      <h2>BloxPlay Accounts</h2>
      <p>Up to 5 accounts can be used on this device.</p>
      <button class="play" onclick="createAccount()">
        Create Account
      </button>
    </div>

  </section>


  <section id="friends" class="page">

    <h1>Friends</h1>

    <div class="game">
      <h2>👥 Friends</h2>
      <p>Your friends list will be added in the next step.</p>
    </div>

  </section>

</main>

<footer>
  BloxPlay © 2026
</footer>


<script>

const games = [
  {
    name: "Mystery Hunt",
    icon: "🔪",
    description: "A 3D mystery game with secret roles and rounds."
  },
  {
    name: "Brain Grab",
    icon: "🧠",
    description: "Collect strange creatures and build your collection."
  },
  {
    name: "Island Survival",
    icon: "🏝️",
    description: "Survive events and explore a mysterious island."
  },
  {
    name: "Block Racers",
    icon: "🏎️",
    description: "Race against other players on crazy tracks."
  },
  {
    name: "Ghost Hunt",
    icon: "👻",
    description: "Explore spooky locations and find hidden clues."
  },
  {
    name: "Coin Rush",
    icon: "💰",
    description: "Collect coins and become the richest player."
  },
  {
    name: "Build City",
    icon: "🏙️",
    description: "Build and expand your own city."
  },
  {
    name: "Farm Life",
    icon: "🌾",
    description: "Grow crops, sell them, and expand your farm."
  },
  {
    name: "Pet World",
    icon: "🐾",
    description: "Collect pets and explore a huge world."
  },
  {
    name: "Factory Tycoon",
    icon: "🏭",
    description: "Build your factory and become a business owner."
  }
];


function showPage(pageName) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(pageName).classList.add("active");

}


function renderGames(searchText, containerId) {

  const container = document.getElementById(containerId);

  const filtered = games.filter(game =>
    game.name.toLowerCase().includes(searchText.toLowerCase())
  );

  container.innerHTML = "";

  filtered.forEach((game, index) => {

    const card = document.createElement("div");

    card.className = "game";

    card.innerHTML = `
      <div class="game-icon">${game.icon}</div>

      <h3>${game.name}</h3>

      <p>${game.description}</p>

      <button class="play" onclick="playGame(${index})">
        ▶ Play
      </button>
    `;

    container.appendChild(card);

  });

}


function searchGames(inputId, containerId) {

  const search = document.getElementById(inputId).value;

  renderGames(search, containerId);

}


function playGame(index) {

  const game = games[index];

  alert(game.name + " is being built!");

}


function createAccount() {

  alert(
    "Account creation will be added in Step 2."
  );

}


renderGames("", "homeGames");
renderGames("", "allGames");

</script>

</body>
</html>
