<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BloxPlay</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

header {
    background: #182235;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 11px 15px;
    background: #29364d;
    color: white;
    font-weight: bold;
}

button:active {
    transform: scale(.96);
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.search {
    display: flex;
    margin: 20px 0;
}

.search input {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
}

.gameGrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.gameCard {
    background: #1b2638;
    border-radius: 14px;
    padding: 18px;
}

.gameIcon {
    font-size: 50px;
}

.gameCard h3 {
    margin-bottom: 5px;
}

.gameCard p {
    color: #aeb8c8;
    min-height: 45px;
}

.playButton {
    width: 100%;
    background: #22c55e;
}

.panel {
    background: #1b2638;
    padding: 20px;
    border-radius: 14px;
    margin-top: 15px;
}

input {
    outline: none;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 30px;
}
</style>
</head>

<body>

<header>

    <div class="logo">🧱 BloxPlay</div>

    <nav>
        <button onclick="showHome()">Home</button>
        <button onclick="showGames()">Games</button>
        <button onclick="showAccounts()">Accounts</button>
        <button onclick="showFriends()">Friends</button>
    </nav>

</header>

<main id="app"></main>

<!-- YOUR SEPARATE SCRIPTS -->
<script src="games.js"></script>
<script src="accounts.js"></script>
<script src="game-launcher.js"></script>

<script>

function showHome() {

    document.getElementById("app").innerHTML = `
        <h1>Welcome to BloxPlay</h1>

        <p>Play games, make friends, and create your own games.</p>

        <div class="search">
            <input
                id="homeSearch"
                placeholder="🔎 Search games..."
                oninput="searchHomeGames()"
            >
        </div>

        <h2>🔥 Popular Games</h2>

        <div id="homeGames" class="gameGrid"></div>
    `;

    displayGames(
        BlockPlayGames,
        "homeGames"
    );
}


function showGames() {

    document.getElementById("app").innerHTML = `
        <h1>🎮 Games</h1>

        <div class="search">
            <input
                id="gameSearch"
                placeholder="🔎 Search games..."
                oninput="searchGamesPage()"
            >
        </div>

        <div id="gameList" class="gameGrid"></div>
    `;

    displayGames(
        BlockPlayGames,
        "gameList"
    );
}


function searchHomeGames() {

    const input =
        document.getElementById("homeSearch");

    const results =
        searchBlockPlayGames(input.value);

    displayGames(
        results,
        "homeGames"
    );
}


function searchGamesPage() {

    const input =
        document.getElementById("gameSearch");

    const results =
        searchBlockPlayGames(input.value);

    displayGames(
        results,
        "gameList"
    );
}


function displayGames(games, containerID) {

    const container =
        document.getElementById(containerID);

    if (!container) return;

    if (games.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No games found.
            </div>
        `;

        return;
    }

    container.innerHTML = games.map(game => `

        <div class="gameCard">

            <div class="gameIcon">
                ${game.icon}
            </div>

            <h3>
                ${game.name}
            </h3>

            <p>
                ${game.description}
            </p>

            <button
                class="playButton"
                onclick="launchBloxPlayGame('${game.name.replace(/'/g, "\\'")}')"
            >
                ▶ Play
            </button>

        </div>

    `).join("");
}


function launchBloxPlayGame(gameName) {

    if (
        typeof BloxPlayGameLauncher !==
        "undefined"
    ) {

        BloxPlayGameLauncher.launch(
            gameName
        );

    } else {

        alert(
            "The game launcher could not be loaded."
        );

    }
}


function showAccounts() {

    document.getElementById("app").innerHTML = `

        <h1>👤 Accounts</h1>

        <div class="panel">

            <h2>Create Account</h2>

            <input
                id="usernameInput"
                placeholder="Username"
                maxlength="20"
                style="
                    width:100%;
                    padding:14px;
                    border-radius:9px;
                    border:0;
                    margin-bottom:10px;
                "
            >

            <button onclick="createBloxAccount()">
                Create Account
            </button>

            <p id="accountMessage"></p>

        </div>

        <div class="panel">

            <h2>🔎 Search Accounts</h2>

            <input
                id="accountSearch"
                placeholder="Search usernames..."
                oninput="searchBloxAccounts()"
                style="
                    width:100%;
                    padding:14px;
                    border-radius:9px;
                    border:0;
                "
            >

            <div id="accountResults"></div>

        </div>
    `;
}


function createBloxAccount() {

    const input =
        document.getElementById("usernameInput");

    const message =
        document.getElementById("accountMessage");

    const result =
        BlockPlayAccounts.createAccount(
            input.value
        );

    if (result.success) {

        message.textContent =
            "Account created: " +
            result.account.username;

        input.value = "";

    } else {

        message.textContent =
            result.message;
    }
}


function searchBloxAccounts() {

    const input =
        document.getElementById("accountSearch");

    const results =
        BlockPlayAccounts.searchAccounts(
            input.value
        );

    const container =
        document.getElementById("accountResults");

    if (!container) return;

    if (!input.value.trim()) {

        container.innerHTML = "";

        return;
    }

    if (results.length === 0) {

        container.innerHTML =
            `<p class="empty">No accounts found.</p>`;

        return;
    }

    container.innerHTML =
        results.map(account => `

            <div class="panel">

                <strong>
                    👤 ${account.username}
                </strong>

                <br><br>

                <button
                    onclick="alert('Friend system coming next.')"
                >
                    ➕ Add Friend
                </button>

            </div>

        `).join("");
}


function showFriends() {

    document.getElementById("app").innerHTML = `

        <h1>👥 Friends</h1>

        <div class="panel">

            <h2>Your Friends</h2>

            <p>
                The online friend system will connect here.
            </p>

        </div>
    `;
}


showHome();

</script>

</body>
</html>
