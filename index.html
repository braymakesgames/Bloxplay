<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BloxPlay</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:white;overflow-x:hidden}
button,input{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;background:#238636;color:white;font-weight:700}
button:active{transform:scale(.97)}
header{height:60px;background:#161b22;display:flex;align-items:center;gap:10px;padding:8px 12px;position:sticky;top:0;z-index:20}
.logo{font-size:22px;font-weight:900;color:#58a6ff}
.nav{display:flex;gap:6px;overflow:auto}
.nav button{background:#21262d}
.balance{margin-left:auto;color:#ffd33d;font-weight:900;white-space:nowrap}
main{padding:16px;max-width:1200px;margin:auto}
.page{display:none}.page.active{display:block}
.card{background:#161b22;border:1px solid #30363d;border-radius:15px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.game{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden}
.game .thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:45px;background:linear-gradient(135deg,#1f6feb,#8957e5)}
.game .info{padding:12px}
.game h3{margin:0 0 6px}
.muted{color:#8b949e}
input{width:100%;padding:11px;border-radius:9px;border:1px solid #30363d;background:#0d1117;color:white;margin:5px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.avatarPreview{height:180px;display:flex;align-items:center;justify-content:center}
.avatar{position:relative;width:70px;height:125px}
.head{position:absolute;width:55px;height:55px;left:8px;top:0;border-radius:12px;background:#f1c27d}
.body{position:absolute;width:60px;height:50px;left:5px;top:58px;border-radius:8px;background:#238636}
.arm{position:absolute;width:15px;height:48px;top:60px;background:#f1c27d;border-radius:8px}
.arm.left{left:-12px}.arm.right{right:-12px}
.leg{position:absolute;width:20px;height:45px;top:108px;background:#30363d;border-radius:6px}
.leg.left{left:10px}.leg.right{right:10px}
#gameScreen{display:none;position:fixed;inset:0;background:#000;z-index:100}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none}
#gameTop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
.gameHud{background:#111b;border:1px solid #ffffff33;border-radius:10px;padding:9px 12px;font-weight:700}
#exitGame{pointer-events:auto;background:#d1242f}
#gameMessage{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#111d;padding:10px 15px;border-radius:10px;z-index:4;text-align:center}
#mobileControls{position:absolute;inset:0;pointer-events:none;z-index:5}
#joystick{position:absolute;left:25px;bottom:30px;width:125px;height:125px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;pointer-events:auto;touch-action:none}
#joystickStick{position:absolute;width:55px;height:55px;left:33px;top:33px;border-radius:50%;background:#ffffff66}
#actionControls{position:absolute;right:25px;bottom:30px;display:flex;gap:12px}
.action{width:70px;height:70px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;display:flex;align-items:center;justify-content:center;font-weight:900;pointer-events:auto;touch-action:none}
#cameraHint{position:absolute;right:20px;top:110px;background:#111a;padding:8px;border-radius:8px;color:#ddd;font-size:12px}
@media(max-width:700px){
 header{height:auto;flex-wrap:wrap}.balance{margin-left:0}
 main{padding:10px}.grid{grid-template-columns:repeat(2,1fr)}
 .game .thumb{height:95px}
}
</style>
</head>
<body>

<header>
<div class="logo">BloxPlay</div>
<div class="nav">
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('games')">Games</button>
<button onclick="showPage('avatar')">Avatar</button>
<button onclick="showPage('accounts')">Accounts</button>
<button onclick="showPage('friends')">Friends</button>
</div>
<div class="balance">🪙 <span id="bux">∞</span></div>
</header>

<main>
<section id="home" class="page active">
<div class="card">
<h1>Welcome to BloxPlay</h1>
<p class="muted">Play original games, customize your avatar, and explore.</p>
<button onclick="showPage('games')">Play Games</button>
</div>
<div class="card">
<h2>Popular Games</h2>
<div id="homeGames" class="grid"></div>
</div>
</section>

<section id="games" class="page">
<div class="card">
<h1>Games</h1>
<input id="gameSearch" placeholder="Search games..." oninput="renderGames()">
</div>
<div id="gamesGrid" class="grid"></div>
</section>

<section id="avatar" class="page">
<div class="card">
<h1>Avatar</h1>
<div class="avatarPreview" id="avatarPreview"></div>
<h3>Skin</h3>
<div class="row">
<button onclick="setSkin('#f1c27d')">Light</button>
<button onclick="setSkin('#c68642')">Tan</button>
<button onclick="setSkin('#8d5524')">Brown</button>
<button onclick="setSkin('#6b4423')">Dark</button>
</div>
<h3>Shirt</h3>
<div class="row">
<button onclick="setShirt('#238636')">Green</button>
<button onclick="setShirt('#1f6feb')">Blue</button>
<button onclick="setShirt('#8957e5')">Purple</button>
<button onclick="setShirt('#d1242f')">Red</button>
<button onclick="setShirt('#f0883e')">Orange</button>
</div>
<button onclick="randomAvatar()">Random Avatar</button>
</div>
</section>

<section id="accounts" class="page">
<div class="card">
<h1>Accounts</h1>
<div id="accountArea"></div>
</div>
</section>

<section id="friends" class="page">
<div class="card">
<h1>Friends</h1>
<input id="friendInput" placeholder="Username">
<button onclick="addFriend()">Add Friend</button>
<div id="friendsList"></div>
</div>
</section>
</main>

<div id="gameScreen">
<canvas id="gameCanvas"></canvas>

<div id="gameTop">
<div class="gameHud" id="gameTitle">BloxPlay</div>
<div class="gameHud">🪙 ∞</div>
<button id="exitGame" onclick="closeGame()">EXIT</button>
</div>

<div id="gameMessage"></div>
<div id="cameraHint">Drag the screen to look around</div>

<div id="mobileControls">
<div id="joystick"><div id="joystickStick"></div></div>
<div id="actionControls">
<div class="action" id="jumpBtn">JUMP</div>
<div class="action" id="actionBtn">ACTION</div>
</div>
</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const games=[
["Mystery Hunt","🕵️","Find clues, explore the map, and discover who the mystery player is.","mystery"],
["Brain Grab","🧠","Collect valuable brain-shaped objects before the timer ends.","grab"],
["Coin Rush","🪙","Race around the map and collect as many coins as possible.","coins"],
["Island Survival","🏝️","Explore an island, collect supplies, and survive the countdown.","island"],
["Block Racers","🏎️","Race around a colorful track and reach the finish line.","race"],
["Build City","🏙️","Explore a growing city and build your own little area.","city"],
["Farm Life","🌾","Explore the farm and collect crops.","farm"],
["Pet World","🐾","Explore the pet world and collect treats.","pets"],
["Factory Tycoon","🏭","Collect factory resources and expand your operation.","factory"],
["Ghost Hunt","👻","Explore the dark map and find hidden objects.","ghost"],
["Sky Islands","☁️","Jump between floating islands and collect stars.","sky"],
["Treasure Island","💎","Search the island for hidden treasure.","treasure"],
["Speed Run","⚡","Reach the finish before the clock runs out.","speed"],
["Obby World","🧱","Jump across platforms and make it to the end.","obby"],
["Snow Resort","❄️","Explore the snowy resort and find hidden items.","snow"],
["Volcano Escape","🌋","Get across the map before the countdown ends.","volcano"],
["Space Base","🚀","Explore a space station and collect energy cells.","space"],
["Zoo World","🦁","Explore the zoo and discover different areas.","zoo"]
];

let currentAccount=localStorage.getItem("bloxplay_current")||"Player";
let accounts=JSON.parse(localStorage.getItem("bloxplay_accounts")||"[]");

if(!accounts.length){
 accounts=[{
  username:"Player",
  password:"",
  avatar:{skin:"#f1c27d",shirt:"#238636"},
  friends:[]
 }];
 localStorage.setItem("bloxplay_accounts",JSON.stringify(accounts));
}

function getAccount(){
 return accounts.find(a=>a.username===currentAccount)||accounts[0];
}

function saveAccounts(){
 localStorage.setItem("bloxplay_accounts",JSON.stringify(accounts));
 localStorage.setItem("bloxplay_current",currentAccount);
}

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 renderAccounts();
 renderFriends();
 renderAvatar();
}

window.showPage=showPage;

function renderGames(){
 const search=(document.getElementById("gameSearch")?.value||"").toLowerCase();
 const html=games.filter(g=>g[0].toLowerCase().includes(search)||g[2].toLowerCase().includes(search))
 .map(g=>`
 <div class="game">
  <div class="thumb">${g[1]}</div>
  <div class="info">
   <h3>${g[0]}</h3>
   <p class="muted">${g[2]}</p>
   <button onclick="openGame('${g[3]}','${g[0]}')">PLAY</button>
  </div>
 </div>`).join("");
 document.getElementById("gamesGrid").innerHTML=html;
 document.getElementById("homeGames").innerHTML=games.slice(0,8).map(g=>`
 <div class="game">
  <div class="thumb">${g[1]}</div>
  <div class="info"><h3>${g[0]}</h3><button onclick="openGame('${g[3]}','${g[0]}')">PLAY</button></div>
 </div>`).join("");
}
window.renderGames=renderGames;

function renderAvatar(){
 const a=getAccount();
 document.getElementById("avatarPreview").innerHTML=`
 <div class="avatar">
  <div class="head" style="background:${a.avatar.skin}"></div>
  <div class="body" style="background:${a.avatar.shirt}"></div>
  <div class="arm left" style="background:${a.avatar.skin}"></div>
  <div class="arm right" style="background:${a.avatar.skin}"></div>
  <div class="leg left"></div><div class="leg right"></div>
 </div>`;
}
window.renderAvatar=renderAvatar;

function setSkin(c){
 getAccount().avatar.skin=c;saveAccounts();renderAvatar();
}
function setShirt(c){
 getAccount().avatar.shirt=c;saveAccounts();renderAvatar();
}
function randomAvatar(){
 const skins=["#f1c27d","#c68642","#8d5524","#6b4423"];
 const shirts=["#238636","#1f6feb","#8957e5","#d1242f","#f0883e"];
 setSkin(skins[Math.floor(Math.random()*skins.length)]);
 setShirt(shirts[Math.floor(Math.random()*shirts.length)]);
}
window.setSkin=setSkin;
window.setShirt=setShirt;
window.randomAvatar=randomAvatar;

function renderAccounts(){
 const area=document.getElementById("accountArea");
 area.innerHTML=`
 <p>Current account: <b>${currentAccount}</b></p>
 <button onclick="logout()">Log Out</button>
 <hr>
 <h3>Switch Account</h3>
 ${accounts.map(a=>`<button onclick="switchAccount('${a.username}')">${a.username}</button>`).join(" ")}
 <hr>
 <h3>Create Account</h3>
 <input id="newUser" placeholder="Username">
 <input id="newPass" type="password" placeholder="Password">
 <button onclick="createAccount()">Create</button>`;
}
window.renderAccounts=renderAccounts;

function createAccount(){
 if(accounts.length>=5)return alert("Maximum 5 accounts.");
 const u=document.getElementById("newUser").value.trim();
 const p=document.getElementById("newPass").value;
 if(!/^[A-Za-z0-9_]{3,20}$/.test(u))return alert("Username must be 3-20 letters, numbers, or underscores.");
 if(/admin|owner|roblox|bloxplay/i.test(u))return alert("That username is not allowed.");
 if(accounts.some(a=>a.username.toLowerCase()===u.toLowerCase()))return alert("Username already exists.");
 accounts.push({username:u,password:p,avatar:{skin:"#f1c27d",shirt:"#238636"},friends:[]});
 currentAccount=u;
 saveAccounts();
 renderAccounts();
 renderAvatar();
}
window.createAccount=createAccount;

function switchAccount(u){
 currentAccount=u;saveAccounts();renderAccounts();renderAvatar();renderFriends();
}
window.switchAccount=switchAccount;

function logout(){
 currentAccount="";
 alert("Logged out.");
}
window.logout=logout;

function renderFriends(){
 const a=getAccount();
 document.getElementById("friendsList").innerHTML=a.friends?.length
 ? a.friends.map(f=>`<div class="card">${f}</div>`).join("")
 : "<p class='muted'>No friends yet.</p>";
}
function addFriend(){
 const input=document.getElementById("friendInput");
 const u=input.value.trim();
 if(!u)return;
 const a=getAccount();
 a.friends=a.friends||[];
 if(!a.friends.includes(u))a.friends.push(u);
 input.value="";
 saveAccounts();
 renderFriends();
}
window.addFriend=addFriend;

let scene,camera,renderer,player,clock;
let running=false;
let gameType="";
let keys={};
let velocityY=0;
let onGround=true;
let cameraYaw=0;
let cameraPitch=.35;
let joystickX=0;
let joystickY=0;
let lookActive=false;
let lastLookX=0;
let lastLookY=0;
let objects=[];
let score=0;
let timeLeft=120;
let gameTimer=null;
let spawnObjects=[];
let finishZ=-80;

const canvas=document.getElementById("gameCanvas");

function openGame(type,title){
 document.getElementById("gameScreen").style.display="block";
 document.getElementById("gameTitle").textContent=title;
 gameType=type;
 start3D(type);
}
window.openGame=openGame;

function closeGame(){
 running=false;
 clearInterval(gameTimer);
 document.getElementById("gameScreen").style.display="none";
 if(renderer)renderer.dispose();
}

window.closeGame=closeGame;

function start3D(type){
 running=true;
 score=0;
 timeLeft=120;
 objects=[];
 spawnObjects=[];
 scene=new THREE.Scene();
 scene.background=new THREE.Color(type==="space"?0x03040a:type==="snow"?0xb9d7ff:0x75bdf2);

 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);

 renderer=new THREE.WebGLRenderer({canvas,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);

 clock=new THREE.Clock();

 const hemi=new THREE.HemisphereLight(0xffffff,0x555555,2);
 scene.add(hemi);

 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(30,50,20);
 scene.add(sun);

 makeWorld(type);
 makePlayer();

 cameraYaw=0;
 cameraPitch=.3;

 document.getElementById("gameMessage").textContent="WASD / joystick to move • Drag to look • Jump";

 clearInterval(gameTimer);
 gameTimer=setInterval(()=>{
  if(!running)return;
  timeLeft--;
  if(timeLeft<=0){
   timeLeft=0;
   endRound();
  }
 },1000);

 animate();
}

function makeWorld(type){
 const groundColor=
 type==="snow"?0xe8f5ff:
 type==="space"?0x151b2e:
 type==="farm"?0x5b9d3c:
 type==="island"?0x56a85c:
 type==="volcano"?0x4b2922:
 type==="city"?0x777b83:
 type==="factory"?0x555b63:
 0x4b9b4d;

 const ground=new THREE.Mesh(
  new THREE.BoxGeometry(240,1,240),
  new THREE.MeshStandardMaterial({color:groundColor})
 );
 ground.position.y=-.5;
 scene.add(ground);

 if(type==="race"||type==="speed"){
  makeRoad();
 }

 if(type==="sky"){
  scene.remove(ground);
  makePlatform(0,0,0,80,2,80,0x6aa7ff);
  for(let i=0;i<12;i++){
   makePlatform((Math.random()-.5)*120,Math.random()*18,(Math.random()-.5)*120,15,2,15,0x7bd66
