<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BloxPlay</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:white;overflow-x:hidden}
button{font:inherit}
#app{min-height:100vh}
header{height:64px;background:#181818;border-bottom:1px solid #333;display:flex;align-items:center;padding:0 16px;gap:18px;position:sticky;top:0;z-index:20}
.logo{font-size:24px;font-weight:900;color:#fff}
nav{display:flex;gap:8px;flex:1}
nav button,.headerBtn{background:#242424;border:0;color:#ddd;padding:10px 14px;border-radius:8px;cursor:pointer}
nav button.active,.headerBtn:hover{background:#333;color:#fff}
.bux{font-weight:800;background:#222;padding:9px 13px;border-radius:8px}
.page{display:none;padding:22px;max-width:1200px;margin:auto}
.page.active{display:block}
h1{margin-top:0}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.gameCard{background:#1d1d1d;border:1px solid #333;border-radius:12px;overflow:hidden}
.gameThumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:50px;background:linear-gradient(135deg,#333,#151515)}
.gameInfo{padding:14px}
.gameInfo h3{margin:0 0 7px}
.playBtn{width:100%;padding:11px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:bold;cursor:pointer}
#gamePage{padding:0;max-width:none}
#gameCanvas{width:100%;height:calc(100vh - 64px);display:block}
#gameUI{position:absolute;left:0;right:0;top:64px;bottom:0;pointer-events:none}
.gameTop{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.65);padding:10px 14px;border-radius:10px}
.speedText{font-size:20px;font-weight:900}
.coinsText{margin-top:4px}
.backGame{position:absolute;right:14px;top:14px;pointer-events:auto;background:rgba(0,0,0,.7);color:white;border:1px solid #555;border-radius:9px;padding:10px 14px}
#joystick{position:absolute;left:25px;bottom:30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#stick{position:absolute;width:55px;height:55px;left:37px;top:37px;border-radius:50%;background:rgba(255,255,255,.45)}
#jump{position:absolute;right:28px;bottom:40px;width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.8);font-weight:bold;pointer-events:auto}
#speedButton{position:absolute;right:25px;bottom:135px;background:#fff;color:#111;border:0;border-radius:10px;padding:12px;font-weight:bold;pointer-events:auto}
@media(max-width:700px){
header{gap:6px;padding:0 8px}
.logo{font-size:19px}
nav{gap:3px}
nav button{padding:8px 7px;font-size:12px}
.bux{display:none}
.page{padding:15px}
}
</style>
</head>
<body>

<div id="app">

<header>
<div class="logo">BloxPlay</div>
<nav>
<button data-page="home" class="active">Home</button>
<button data-page="games">Games</button>
<button data-page="avatar">Avatar</button>
<button data-page="friends">Friends</button>
</nav>
<div class="bux">∞ BloxBux</div>
</header>

<section id="home" class="page active">
<h1>Welcome to BloxPlay</h1>
<p>Play original games with your friends.</p>
<div class="games" id="homeGames"></div>
</section>

<section id="games" class="page">
<h1>Games</h1>
<div class="games" id="gamesList"></div>
</section>

<section id="avatar" class="page">
<h1>Your Avatar</h1>
<p>Blocky avatar customization coming with the full avatar system.</p>
</section>

<section id="friends" class="page">
<h1>Friends</h1>
<p>Multiplayer and friends are being connected to the platform.</p>
</section>

<section id="gamePage" class="page">
<canvas id="gameCanvas"></canvas>

<div id="gameUI">
<div class="gameTop">
<div class="speedText">⚡ Speed: <span id="speedValue">1</span></div>
<div class="coinsText">🪙 Coins: <span id="coinValue">0</span></div>
</div>

<button class="backGame" id="leaveGame">Leave Game</button>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="speedButton">+1 SPEED</button>
<button id="jump">JUMP</button>
</div>
</section>

</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const games=[
["+1 Speed","⚡","Run, collect speed, and become faster."],
["Blox Doors","🚪","Explore rooms, find keys, and survive."],
["Mystery Hunt","🕵️","Search a neighborhood for clues."],
["Block Racers","🏎️","Race through a full blocky track."],
["Build City","🏗️","Build and expand your own city."],
["Farm Life","🌾","Grow crops and build your farm."],
["Pet World","🐾","Explore and collect pets."],
["Island Survival","🏝️","Explore an island and survive."]
];

const homeGames=document.getElementById("homeGames");
const gamesList=document.getElementById("gamesList");

function makeCard(game){
const card=document.createElement("div");
card.className="gameCard";
card.innerHTML=`
<div class="gameThumb">${game[1]}</div>
<div class="gameInfo">
<h3>${game[0]}</h3>
<p>${game[2]}</p>
<button class="playBtn">PLAY</button>
</div>`;
card.querySelector(".playBtn").onclick=()=>{
if(game[0]==="+1 Speed") startSpeedGame();
else alert(game[0]+" is being built.");
};
return card;
}

games.forEach(g=>{
homeGames.appendChild(makeCard(g));
gamesList.appendChild(makeCard(g));
});

document.querySelectorAll("nav button").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(btn.dataset.page).classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
};
});

const canvas=document.getElementById("gameCanvas");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(70,1,.1,1000);

const ambient=new THREE.HemisphereLight(0xffffff,0x555555,2);
scene.add(ambient);

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,40,10);
scene.add(sun);

let player;
let velocityY=0;
let grounded=true;
let speed=1;
let coins=0;
let running=false;

const keys={};
let joyX=0;
let joyY=0;

function createBlock(x,y,z,w,h,d,color){
const geo=new THREE.BoxGeometry(w,h,d);
const mat=new THREE.MeshStandardMaterial({color});
const mesh=new THREE.Mesh(geo,mat);
mesh.position.set(x,y,z);
scene.add(mesh);
return mesh;
}

function buildSpeedWorld(){

scene.clear();
scene.add(ambient);
scene.add(sun);

scene.background=new THREE.Color(0x8ed6ff);

const ground=createBlock(0,-1,0,180,2,180,0x4caf50);

for(let x=-80;x<=80;x+=20){
createBlock(x,1,-35,12,4,12,0xdddddd);
createBlock(x,1,35,12,4,12,0xdddddd);
}

for(let z=-80;z<=80;z+=20){
createBlock(-35,1,z,12,4,12,0xdddddd);
createBlock(35,1,z,12,4,12,0xdddddd);
}

createBlock(0,1,-65,70,4,8,0x555555);
createBlock(0,1,65,70,4,8,0x555555);

for(let i=0;i<30;i++){
const x=(Math.random()-.5)*120;
const z=(Math.random()-.5)*120;
const coin=createBlock(x,1.5,z,2,2,2,0xffd700);
coin.userData.coin=true;
coin.rotation.y=Math.PI/4;
}

for(let i=0;i<18;i++){
const x=(Math.random()-.5)*110;
const z=(Math.random()-.5)*110;
const h=3+Math.random()*8;
createBlock(x,h/2,z,4,h,4,0x777777);
}

createBlock(0,2,-75,25,4,4,0x222222);

for(let i=0;i<8;i++){
const x=-28+i*8;
createBlock(x,1,58,5,2,5,0x3498db);
}

createPlayer();
}

function createPlayer(){

player=new THREE.Group();

const body=createBlock(0,0,0,2,3,1.4,0x3498db);
body.position.set(0,2.7,0);
body.parent=null;

const head=new THREE.Mesh(
new THREE.BoxGeometry(1.8,1.8,1.8),
new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y=5.1;

const bodyMesh=new THREE.Mesh(
new THREE.BoxGeometry(2,3,1.4),
new THREE.MeshStandardMaterial({color:0x3498db})
);
bodyMesh.position.y=2.7;

const leftArm=new THREE.Mesh(
new THREE.BoxGeometry(.7,3,.7),
new THREE.MeshStandardMaterial({color:0xffcc99})
);
leftArm.position.set(-1.35,2.7,0);

const rightArm=leftArm.clone();
rightArm.position.x=1.35;

const leftLeg=new THREE.Mesh(
new THREE.BoxGeometry(.8,3,.8),
new THREE.MeshStandardMaterial({color:0x222222})
);
leftLeg.position.set(-.5,.0,0);

const rightLeg=leftLeg.clone();
rightLeg.position.x=.5;

player.add(head,bodyMesh,leftArm,rightArm,leftLeg,rightLeg);
player.position.set(0,0,50);

scene.add(player);

camera.position.set(0,7,62);
}

function resize(){
const w=canvas.clientWidth;
const h=canvas.clientHeight;
if(w&&h){
camera.aspect=w/h;
camera.updateProjectionMatrix();
renderer.setSize(w,h,false);
}
}
window.addEventListener("resize",resize);

const stick=document.getElementById("stick");
const joystick=document.getElementById("joystick");

let joyPointer=null;

joystick.addEventListener("pointerdown",e=>{
joyPointer=e.pointerId;
joystick.setPointerCapture(e.pointerId);
updateJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
if(e.pointerId===joyPointer) updateJoystick(e);
});

joystick.addEventListener("pointerup",e=>{
if(e.pointerId===joyPointer){
joyPointer=null;
joyX=0;
joyY=0;
stick.style.left="37px";
stick.style.top="37px";
}
});

function updateJoystick(e){
const r=joystick.getBoundingClientRect();
let x=e.clientX-(r.left+r.width/2);
let y=e.clientY-(r.top+r.height/2);
const max=38;
const len=Math.hypot(x,y);
if(len>max){
x=x/len*max;
y=y/len*max;
}
joyX=x/max;
joyY=y/max;
stick.style.left=(37+x)+"px";
stick.style.top=(37+y)+"px";
}

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

document.getElementById("jump").onclick=()=>{
if(grounded){
velocityY=0.32;
grounded=false;
}
};

document.getElementById("speedButton").onclick=()=>{
speed+=1;
document.getElementById("speedValue").textContent=speed;
};

function collectCoins(){

for(const obj of [...scene.children]){
if(obj.userData?.coin){
const dx=obj.position.x-player.position.x;
const dz=obj.position.z-player.position.z;
if(Math.hypot(dx,dz)<3){
scene.remove(obj);
coins++;
document.getElementById("coinValue").textContent=coins;
speed+=0.1;
document.getElementById("speedValue").textContent=Math.floor(speed);
}
}
}
}

let last=performance.now();

function animate(now){

requestAnimationFrame(animate);

if(!running){
renderer.render(scene,camera);
return;
}

const dt=Math.min((now-last)/16.67,2);
last=now;

let forward=0;
let strafe=0;

if(keys.w) forward+=1;
if(keys.s) forward-=1;
if(keys.d) strafe+=1;
if(keys.a) strafe-=1;

forward+=-joyY;
strafe+=joyX;

const inputLength=Math.hypot(forward,strafe);

if(inputLength>1){
forward/=inputLength;
strafe/=inputLength;
}

if(inputLength>.05){

/*
 FIXED TURNING:
 The character rotates toward the direction it is actually moving.
 Movement is based on the camera's horizontal direction.
 */

const cameraForward=new THREE.Vector3();
camera.getWorldDirection(cameraForward);
cameraForward.y=0;
cameraForward.normalize();

const cameraRight=new THREE.Vector3(
cameraForward.z,
0,
-cameraForward.x
);

const moveDirection=new THREE.Vector3();

moveDirection.addScaledVector(cameraForward,forward);
moveDirection.addScaledVector(cameraRight,strafe);
moveDirection.normalize();

const moveSpeed=.16*speed*dt;

player.position.x+=moveDirection.x*moveSpeed;
player.position.z+=moveDirection.z*moveSpeed;

/* Smooth character turning */
const targetRotation=Math.atan2(moveDirection.x,moveDirection.z);

let diff=targetRotation-player.rotation.y;

while(diff>Math.PI) diff-=Math.PI*2;
while(diff<-Math.PI) diff+=Math.PI*2;

player.rotation.y+=diff*.18*dt;

}

velocityY-=.018*dt;
player.position.y+=velocityY*dt;

if(player.position.y<=0){
player.position.y=0;
velocityY=0;
grounded=true;
}

/* Camera follows behind character */
const behind=new THREE.Vector3(0,5.8,9);
behind.applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);

const desiredCamera=player.position.clone().add(behind);

camera.position.lerp(desiredCamera,.12*dt);

camera.lookAt(
player.position.x,
player.position.y+3,
player.position.z
);

collectCoins();

renderer.render(scene,camera);

last=now;
}

requestAnimationFrame(animate);

function startSpeedGame(){

document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById("gamePage").classList.add("active");

running=true;
speed=1;
coins=0;

document.getElementById("speedValue").textContent="1";
document.getElementById("coinValue").textContent="0";

buildSpeedWorld();
resize();
last=performance.now();
}

document.getElementById("leaveGame").onclick=()=>{
running=false;
document.getElementById("gamePage").classList.remove("active");
document.getElementById("games").classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
document.querySelector('[data-page="games"]').classList.add("active");
};

buildSpeedWorld();
resize();
renderer.render(scene,camera);
</script>

</body>
</html>
