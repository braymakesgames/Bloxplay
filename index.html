<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BloxPlay</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f2f2;
 color:#222
}

header{
 background:#111;
 color:white;
 padding:14px 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:10;
 gap:10px;
 flex-wrap:wrap
}

.logo{
 font-size:24px;
 font-weight:bold
}

nav button{
 background:transparent;
 color:white;
 border:0;
 margin:0 3px;
 padding:9px 10px;
 font-size:15px;
 cursor:pointer
}

nav button:hover{
 background:#333;
 border-radius:8px
}

.bux{
 background:#222;
 padding:8px 12px;
 border-radius:8px;
 color:#ffd83d;
 font-weight:bold
}

main{
 max-width:1100px;
 margin:auto;
 padding:25px 16px
}

.page{display:none}
.page.active{display:block}

.hero{
 background:linear-gradient(135deg,#202020,#444);
 color:white;
 padding:35px;
 border-radius:16px;
 margin-bottom:25px
}

.hero h1{
 margin-top:0;
 font-size:38px
}

.hero p{color:#ddd}

.search{
 width:100%;
 padding:14px;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:16px;
 margin-bottom:20px
}

.games{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:16px
}

.game,.account-box{
 background:white;
 border-radius:14px;
 padding:18px;
 box-shadow:0 3px 12px rgba(0,0,0,.08);
 margin-bottom:15px
}

.game-icon{
 height:120px;
 border-radius:10px;
 background:linear-gradient(135deg,#777,#222);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:45px;
 margin-bottom:12px
}

.game h3{margin:5px 0}
.game p{color:#666}

.play,.account-btn{
 width:100%;
 padding:11px;
 background:#111;
 color:white;
 border:0;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
 margin-top:8px
}

.play:hover,.account-btn:hover{
 background:#333
}

input{
 padding:12px;
 width:100%;
 border:1px solid #ccc;
 border-radius:8px;
 margin:6px 0;
 font-size:16px
}

.account-card{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#f5f5f5;
 padding:12px;
 border-radius:9px;
 margin:8px 0;
 gap:10px
}

.account-card button{
 background:#111;
 color:white;
 border:0;
 border-radius:7px;
 padding:8px 12px
}

.status{
 padding:12px;
 border-radius:8px;
 background:#eee;
 margin-bottom:15px
}

.logout{
 background:#c62828!important
}

footer{
 text-align:center;
 color:#777;
 padding:30px
}

@media(max-width:700px){
 .hero h1{font-size:30px}
 nav{
  width:100%;
  overflow-x:auto;
  white-space:nowrap
 }
}
</style>
</head>

<body>

<header>

<div class="logo">🧱 BloxPlay</div>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('games')">Games</button>
<button onclick="showPage('accounts')">Accounts</button>
<button onclick="showPage('friends')">Friends</button>
</nav>

<div class="bux">
💰 <span id="bux">0</span> BloxBux
</div>

</header>


<main>

<!-- HOME -->

<section id="home" class="page active">

<div class="hero">
<h1>Welcome to BloxPlay</h1>
<p>Play games, make friends, create experiences, and earn BloxBux.</p>
</div>

<input
class="search"
id="homeSearch"
placeholder="Search games..."
oninput="searchGames('homeSearch','homeGames')"
>

<h2>🔥 Popular Games</h2>

<div id="homeGames" class="games"></div>

</section>


<!-- GAMES -->

<section id="games" class="page">

<h1>Games</h1>

<input
class="search"
id="gameSearch"
placeholder="Search games..."
oninput="searchGames('gameSearch','allGames')"
>

<div id="allGames" class="games"></div>

</section>


<!-- ACCOUNTS -->

<section id="accounts" class="page">

<h1>Accounts</h1>

<div id="accountStatus" class="status"></div>


<div class="account-box">

<h2>Create Account</h2>

<input
id="newUsername"
placeholder="Username"
maxlength="20"
>

<input
id="newPassword"
type="password"
placeholder="Password"
>

<button class="account-btn" onclick="createAccount()">
Create Account
</button>

</div>


<div class="account-box">

<h2>Login</h2>

<input
id="loginUsername"
placeholder="Username"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button class="account-btn" onclick="login()">
Login
</button>

</div>


<div class="account-box">

<h2>Your Accounts</h2>

<div id="accountList"></div>

</div>

</section>


<!-- FRIENDS -->

<section id="friends" class="page">

<h1>Friends</h1>

<div class="game">

<h2>👥 Friends</h2>

<p>
The friends system will be connected to the BloxPlay server later.
</p>

</div>

</section>

</main>


<footer>
BloxPlay © 2026
</footer>


<script>

const games = [

{
name:"Mystery Hunt",
icon:"🔪",
description:"A 3D mystery game with secret roles and rounds."
},

{
name:"Brain Grab",
icon:"🧠",
description:"Collect strange creatures and build your collection."
},

{
name:"Island Survival",
icon:"🏝️",
description:"Survive events and explore a mysterious island."
},

{
name:"Block Racers",
icon:"🏎️",
description:"Race against other players on crazy tracks."
},

{
name:"Ghost Hunt",
icon:"👻",
description:"Explore spooky locations and find hidden clues."
},

{
name:"Coin Rush",
icon:"💰",
description:"Collect coins and become the richest player."
},

{
name:"Build City",
icon:"🏙️",
description:"Build and expand your own city."
},

{
name:"Farm Life",
icon:"🌾",
description:"Grow crops, sell them, and expand your farm."
},

{
name:"Pet World",
icon:"🐾",
description:"Collect pets and explore a huge world."
},

{
name:"Factory Tycoon",
icon:"🏭",
description:"Build your factory and become a business owner."
}

];


/* ACCOUNT STORAGE */

let accounts =
JSON.parse(localStorage.getItem("bloxplayAccounts") || "[]");

let currentUsername =
localStorage.getItem("bloxplayCurrent") || "";


/* PAGE SYSTEM */

function showPage(pageName){

 document.querySelectorAll(".page").forEach(page=>{
  page.classList.remove("active");
 });

 document.getElementById(pageName).classList.add("active");

 if(pageName==="accounts"){
  renderAccounts();
 }

}


/* GAMES */

function renderGames(searchText,containerId){

 const container=document.getElementById(containerId);

 const filtered=games.filter(game=>
  game.name.toLowerCase().includes(searchText.toLowerCase())
 );

 container.innerHTML="";

 filtered.forEach((game,index)=>{

  const card=document.createElement("div");

  card.className="game";

  card.innerHTML=`

  <div class="game-icon">${game.icon}</div>

  <h3>${game.name}</h3>

  <p>${game.description}</p>

  <button class="play" onclick="playGame(${index})">
  ▶ Play
  </button>

  `;

  container.appendChild(card);

 });

}


function searchGames(inputId,containerId){

 const search=document.getElementById(inputId).value;

 renderGames(search,containerId);

}


function playGame(index){

 alert(
  games[index].name+
  " is being built!"
 );

}


/* ACCOUNT CREATION */

function createAccount(){

 const username=
 document.getElementById("newUsername").value.trim();

 const password=
 document.getElementById("newPassword").value;


 if(username.length<3){

  alert("Username must be at least 3 characters.");

  return;
 }


 if(password.length<6){

  alert("Password must be at least 6 characters.");

  return;
 }


 if(accounts.length>=5){

  alert("You can only have 5 BloxPlay accounts on this device.");

  return;
 }


 const exists=accounts.some(account=>
  account.username.toLowerCase()===username.toLowerCase()
 );


 if(exists){

  alert("That username already exists.");

  return;
 }


 const badWords=[
  "admin",
  "owner",
  "moderator",
  "fuck",
  "shit",
  "bitch"
 ];


 if(badWords.some(word=>
  username.toLowerCase().includes(word)
 )){

  alert("That username is not allowed.");

  return;
 }


 const newAccount={

  username:username,

  password:password,

  bloxBux:0,

  friends:[]

 };


 accounts.push(newAccount);

 saveAccounts();

 currentUsername=username;

 localStorage.setItem(
  "bloxplayCurrent",
  currentUsername
 );

 document.getElementById("newUsername").value="";
 document.getElementById("newPassword").value="";

 renderAccounts();

 updateBux();

 alert("Account created!");

}


/* LOGIN */

function login(){

 const username=
 document.getElementById("loginUsername").value.trim();

 const password=
 document.getElementById("loginPassword").value;


 const account=accounts.find(a=>
  a.username.toLowerCase()===username.toLowerCase()
  &&
  a.password===password
 );


 if(!account){

  alert("Incorrect username or password.");

  return;
 }


 currentUsername=account.username;

 localStorage.setItem(
  "bloxplayCurrent",
  currentUsername
 );

 document.getElementById("loginUsername").value="";
 document.getElementById("loginPassword").value="";

 renderAccounts();

 updateBux();

 alert("Logged in as "+currentUsername+"!");

}


/* SWITCH ACCOUNT */

function switchAccount(username){

 const account=accounts.find(a=>
  a.username===username
 );

 if(!account)return;

 currentUsername=username;

 localStorage.setItem(
  "bloxplayCurrent",
  username
 );

 renderAccounts();

 updateBux();

}


/* LOGOUT */

function logout(){

 currentUsername="";

 localStorage.removeItem("bloxplayCurrent");

 renderAccounts();

 updateBux();

}


/* ACCOUNT DISPLAY */

function renderAccounts(){

 const status=
 document.getElementById("accountStatus");

 const list=
 document.getElementById("accountList");


 if(currentUsername){

  status.innerHTML=
  "🟢 Logged in as <b>"+
  currentUsername+
  "</b>";

 }else{

  status.innerHTML=
  "🔴 You are not logged in.";

 }


 list.innerHTML="";


 accounts.forEach(account=>{

  const div=document.createElement("div");

  div.className="account-card";

  div.innerHTML=`

  <span>
  👤 <b>${account.username}</b>
  </span>

  <span>

  <button onclick="switchAccount('${account.username}')">
  Switch
  </button>

  </span>

  `;

  list.appendChild(div);

 });


 if(currentUsername){

  const logoutButton=
  document.createElement("button");

  logoutButton.className="account-btn logout";

  logoutButton.innerText="Log Out";

  logoutButton.onclick=logout;

  list.appendChild(logoutButton);

 }

}


/* BLOXBUX */

function updateBux(){

 const display=
 document.getElementById("bux");

 if(!currentUsername){

  display.innerText="0";

  return;
 }


 const account=accounts.find(a=>
  a.username===currentUsername
 );

 if(account){

  display.innerText=account.bloxBux;

 }

}


function saveAccounts(){

 localStorage.setItem(
  "bloxplayAccounts",
  JSON.stringify(accounts)
 );

}


/* START */

renderGames("", "homeGames");

renderGames("", "allGames");

renderAccounts();

updateBux();

</script>

</body>
</html>
