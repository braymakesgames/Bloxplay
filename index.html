<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BloxPlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:white;font-family:Arial}
button{border:0;border-radius:10px;padding:10px;font-weight:bold}
header{height:60px;background:#181818;display:flex;align-items:center;padding:8px;gap:8px;overflow:auto}
.logo{font-size:22px;font-weight:900}
nav{display:flex;gap:5px}
nav button{background:#292929;color:white;white-space:nowrap}
nav button.active{background:white;color:black}
.page{display:none;padding:18px}
.page.active{display:block}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#202020;border-radius:14px;overflow:hidden}
.thumb{height:130px;display:grid;place-items:center;font-size:55px;background:#292929}
.info{padding:14px}
.info h3{margin:0 0 8px}
.info p{color:#bbb;min-height:45px}
.play{width:100%;background:white;color:black}
#gamePage{padding:0;height:calc(100vh - 60px);position:relative;overflow:hidden}
#canvas{width:100%;height:100%;display:block}
