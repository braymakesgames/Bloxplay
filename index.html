<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BlockPlay</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

header {
  background: #1f2937;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

nav button {
  background: #374151;
  color: white;
  border: 0;
  padding: 11px 15px;
  border-radius: 8px;
  margin: 3px;
}

nav button:active {
  transform: scale(.96);
}

main {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.search {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.search input {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: 0;
  font-size: 16px;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.game {
  background: #1f2937;
  border-radius: 14px;
  padding: 18px;
}

.game-icon {
  font-size: 50px;
}

.game h3 {
  margin-bottom: 5px;
}

.game p {
  color: #9ca3af;
}

.play {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  color: white;
}

.empty {
  color: #9ca3af;
  text-align: center;
  padding: 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🧱 BlockPlay</div>

  <nav>
    <button onclick="showHome()">Home</button>
    <button onclick="showGames()">Games</button>
    <button onclick="showAccounts()">Accounts</button>
    <button onclick="showFriends()">Friends</button>
  </nav>
</header>

<main id="app"></main>

<script>

const games = [
  {
    name: "Mystery Hunt",
    icon: "🕵️",
    description: "Find the hidden hunter and survive the round.",
    tags: "mm2 mystery detective"
  },
  {
    name: "Brain Grab",
    icon: "🧠",
    description: "Collect characters and bring them back to your base.",
    tags: "sab collecting base"
  },
  {
    name: "Island Survival",
    icon: "🏝️",
    description: "Survive on a dangerous block island.",
    tags: "survival island"
  },
  {
    name: "Block Racers",
    icon: "🏎️",
    description: "Race other players through blocky tracks.",
    tags: "racing cars race"
  },
  {
    name: "Ghost Hunt",
    icon: "👻",
    description: "Search the map and find mysterious ghosts.",
    tags: "ghost hunt"
  },
  {
    name: "Coin Rush",
    icon: "🪙",
    description: "Collect as many coins as possible.",
    tags: "coins money simulator"
  },
  {
    name: "Build City",
    icon: "🏙️",
    description: "Build your own block city.",
    tags: "building city"
  }
];

function showHome() {
  document.getElementById("app").innerHTML = `
    <h1>Welcome to BlockPlay</h1>
    <p>Make. Play. Create.</p>

    <div class="search">
      <input
        id="searchInput"
        placeholder="🔎 Search games..."
        oninput="searchGames()"
      >
    </div>

    <h2>Popular Games</h2>

    <div id="gameList" class="game-grid"></div>
  `;

  displayGames(games);
}

function showGames() {
  document.getElementById("app").innerHTML = `
    <h1>🎮 Games</h1>

    <div class="search">
      <input
        id="searchInput"
        placeholder="🔎 Search games..."
        oninput="searchGames()"
      >
    </div>

    <div id="gameList" class="game-grid"></div>
  `;

  displayGames(games);
}

function searchGames() {
  const input = document.getElementById("searchInput");

  if (!input) return;

  const search = input.value.toLowerCase().trim();

  const results = games.filter(game =>
    game.name.toLowerCase().includes(search) ||
    game.description.toLowerCase().includes(search) ||
    game.tags.toLowerCase().includes(search)
  );

  displayGames(results);
}

function displayGames(list) {

  const container = document.getElementById("gameList");

  if (!container) return;

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty">
        No games found.
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(game => `
    <div class="game">
      <div class="game-icon">${game.icon}</div>

      <h3>${game.name}</h3>

      <p>${game.description}</p>

      <button
        class="play"
        onclick="playGame('${game.name}')"
      >
        ▶ Play
      </button>
    </div>
  `).join("");
}

function playGame(name) {
  document.getElementById("app").innerHTML = `
    <h1>🎮 ${name}</h1>

    <div class="game">
      <h2>Game loading...</h2>
      <p>
        The playable version of this game will be added next.
      </p>

      <button class="play" onclick="showGames()">
        ← Back to Games
      </button>
    </div>
  `;
}

function showAccounts() {
  document.getElementById("app").innerHTML = `
    <h1>👤 Accounts</h1>
    <p>Your account system is still connected.</p>
  `;
}

function showFriends() {
  document.getElementById("app").innerHTML = `
    <h1>👥 Friends</h1>

    <div class="game">
      <h2>Friends</h2>
      <p>Friend requests and online players will be added here.</p>
    </div>
  `;
}

showHome();

</script>

</body>
</html>
