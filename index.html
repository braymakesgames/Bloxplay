<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BloxPlay">
<meta name="theme-color" content="#111827">
<title>BloxPlay</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0b0f17;color:#fff}
body{overflow:hidden}
button,input{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;background:#238636;color:#fff;font-weight:800}
button:active{transform:scale(.97)}
input{background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:10px;padding:11px;width:100%}

#app{height:100%;display:flex;flex-direction:column}
header{
 height:62px;flex-shrink:0;background:#111827;
 display:flex;align-items:center;gap:10px;padding:8px 12px;
 border-bottom:1px solid #293241
}
.logo{font-size:23px;font-weight:1000;color:#58a6ff}
nav{display:flex;gap:5px;overflow-x:auto}
nav button{background:#202938;white-space:nowrap;padding:9px 12px}
#bux{margin-left:auto;color:#ffd33d;font-weight:1000;white-space:nowrap}

main{flex:1;overflow:auto;padding:15px}
.page{display:none}.page.active{display:block}
.card{
 background:#151b26;border:1px solid #293241;border-radius:16px;
 padding:15px;margin-bottom:14px
}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px
}
.game,.item{
 background:#151b26;border:1px solid #293241;border-radius:15px;
 overflow:hidden
}
.thumb{
 height:120px;display:flex;align-items:center;justify-content:center;
 font-size:50px;background:linear-gradient(135deg,#2563eb,#7c3aed)
}
.info,.itemInfo{padding:12px}
.price{color:#ffd33d;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap}

.avatarBox{
 height:220px;display:flex;justify-content:center;align-items:center;
 background:#0d1117;border-radius:14px
}
.avatar3d{
 position:relative;width:90px;height:175px
}
.aHead{
 position:absolute;width:65px;height:65px;left:13px;top:0;
 background:#f1c27d;border-radius:8px
}
.aBody{
 position:absolute;width:70px;height:65px;left:10px;top:68px;
 background:#238636;border-radius:5px
}
.aArm{
 position:absolute;width:18px;height:63px;top:69px;
 background:#f1c27d;border-radius:5px
}
.aArm.l{left:-10px}.aArm.r{right:-10px}
.aLeg{
 position:absolute;width:25px;height:52px;top:133px;
 background:#30363d;border-radius:4px
}
.aLeg.l{left:17px}.aLeg.r{right:17px}

.shopTabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}
.shopTabs button{background:#202938;white-space:nowrap}
.shopTabs button.active{background:#238636}

.itemIcon{
 height:120px;display:flex;align-items:center;justify-content:center;
 font-size:55px;background:linear-gradient(135deg,#18243a,#26334c)
}
.owned{color:#3fb950;font-weight:900}

.profileAvatar{
 width:65px;height:65px;border-radius:10px;
 background:#f1c27d;border:4px solid #30363d
}

#gameScreen{
 display:none;position:fixed;inset:0;background:#000;z-index:999
}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none}
#gameTop{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;z-index:10;
 pointer-events:none
}
#gameTitle,#gameStats{
 background:#111c;padding:9px 12px;border-radius:10px;font-weight:900
}
#exitGame{background:#d1242f;pointer-events:auto}
#gameMessage{
 position:absolute;top:65px;left:50%;transform:translateX(-50%);
 background:#111d;padding:9px 13px;border-radius:10px;z-index:10;
 text-align:center;white-space:nowrap
}
#joystick{
 position:absolute;left:24px;bottom:28px;width:125px;height:125px;
 border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;
 z-index:10;touch-action:none
}
#joystickStick{
 position:absolute;left:33px;top:33px;width:55px;height:55px;
 border-radius:50%;background:#ffffff66
}
#actions{
 position:absolute;right:22px;bottom:28px;display:flex;gap:12px;z-index:10
}
.action{
 width:70px;height:70px;border-radius:50%;
 background:#ffffff22;border:2px solid #ffffff55;
 display:flex;align-items:center;justify-content:center;
 font-weight:900;touch-action:none
}

@media(max-width:650px){
 header{height:auto;min-height:62px;flex-wrap:wrap}
 nav{width:100%}
 #bux{margin-left:0}
 main{padding:9px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .thumb,.itemIcon{height:95px}
}
</style>
</head>

<body>

<div id="app">

<header>
<div class="logo">BloxPlay</div>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('games')">Games</button>
<button onclick="showPage('shop')">Shop</button>
<button onclick="showPage('inventory')">Inventory</button>
<button onclick="showPage('avatar')">Avatar</button>
<button onclick="showPage('accounts')">Accounts</button>
<button onclick="showPage('friends')">Friends</button>
</nav>

<div id="bux">🪙 ∞</div>
</header>

<main>

<section id="home" class="page active">
<div class="card">
<h1>BloxPlay</h1>
<p>Play blocky games. Customize your avatar. Collect BloxBux.</p>
<div class="row">
<button onclick="showPage('games')">PLAY</button>
<button onclick="showPage('shop')">SHOP</button>
</div>
</div>

<h2>Featured Games</h2>
<div id="homeGames" class="grid"></div>
</section>

<section id="games" class="page">
<div class="card">
<h1>Games</h1>
<input id="gameSearch" placeholder="Search games..." oninput="renderGames()">
</div>
<div id="gamesGrid" class="grid"></div>
</section>

<section id="shop" class="page">
<div class="card">
<h1>BloxPlay Shop</h1>
<p class="muted">Buy items with BloxBux.</p>

<div class="shopTabs">
<button class="active" onclick="shopCategory('all',this)">All</button>
<button onclick="shopCategory('hats',this)">Hats</button>
<button onclick="shopCategory('faces',this)">Faces</button>
<button onclick="shopCategory('shirts',this)">Shirts</button>
<button onclick="shopCategory('pants',this)">Pants</button>
</div>

<input id="shopSearch" placeholder="Search items..." oninput="renderShop()">
</div>

<div id="shopGrid" class="grid"></div>
</section>

<section id="inventory" class="page">
<div class="card">
<h1>Inventory</h1>
<p class="muted">Items you own.</p>
</div>
<div id="inventoryGrid" class="grid"></div>
</section>

<section id="avatar" class="page">
<div class="card">
<h1>Avatar</h1>
<div class="avatarBox" id="avatarPreview"></div>

<h3>Skin</h3>
<div class="row">
<button onclick="setSkin('#f1c27d')">Light</button>
<button onclick="setSkin('#c68642')">Tan</button>
<button onclick="setSkin('#8d5524')">Brown</button>
<button onclick="setSkin('#6b4423')">Dark</button>
</div>

<h3>Shirt</h3>
<div class="row">
<button onclick="setShirt('#238636')">Green</button>
<button onclick="setShirt('#1f6feb')">Blue</button>
<button onclick="setShirt('#8957e5')">Purple</button>
<button onclick="setShirt('#d1242f')">Red</button>
<button onclick="setShirt('#f0883e')">Orange</button>
</div>
</div>
</section>

<section id="accounts" class="page">
<div class="card">
<h1>Accounts</h1>
<div id="accountArea"></div>
</div>
</section>

<section id="friends" class="page">
<div class="card">
<h1>Friends</h1>
<input id="friendInput" placeholder="Username">
<button onclick="addFriend()">Add Friend</button>
<div id="friendsList"></div>
</div>
</section>

</main>
</div>

<div id="gameScreen">

<canvas id="gameCanvas"></canvas>

<div id="gameTop">
<div id="gameTitle">BloxPlay</div>
<div id="gameStats">🪙 ∞</div>
<button id="exitGame" onclick="closeGame()">EXIT</button>
</div>

<div id="gameMessage"></div>

<div id="joystick">
<div id="joystickStick"></div>
</div>

<div id="actions">
<div class="action" id="jumpBtn">JUMP</div>
<div class="action" id="actionBtn">ACTION</div>
</div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const games=[
["Mystery Hunt","🕵️","Explore the blocky town and solve the mystery.","mystery"],
["Brain Grab","🧠","Collect valuable objects around the map.","grab"],
["Coin Rush","🪙","Collect as many coins as possible.","coins"],
["Island Survival","🏝️","Explore a huge blocky island.","island"],
["Block Racers","🏎️","Race around the track.","race"],
["Build City","🏙️","Explore the growing block city.","city"],
["Farm Life","🌾","Collect crops and explore the farm.","farm"],
["Pet World","🐾","Find treats throughout the pet world.","pets"],
["Factory Tycoon","🏭","Collect factory resources.","factory"],
["Ghost Hunt","👻","Find hidden objects in the map.","ghost"],
["Sky Islands","☁️","Jump across floating islands.","sky"],
["Treasure Island","💎","Search for hidden treasure.","treasure"],
["Speed Run","⚡","Reach the finish before time runs out.","speed"],
["Obby World","🧱","Jump across blocky obstacles.","obby"],
["Snow Resort","❄️","Explore the snowy resort.","snow"],
["Volcano Escape","🌋","Escape across the blocky volcano map.","volcano"],
["Space Base","🚀","Explore the space station.","space"],
["Zoo World","🦁","Explore the blocky zoo.","zoo"],
["Tower Defense","🗼","Defend your base from incoming targets.","tower"],
["Mini Golf","⛳","Play a blocky mini golf course.","golf"],
["Hide & Seek","🙈","Find the best hiding places.","hide"],
["Pet Race","🐶","Race your pets through the course.","petrace"],
["Block Battle","🧱","Compete in original block challenges.","battle"],
["Restaurant Life","🍔","Run around the restaurant and complete tasks.","restaurant"]
];

const items=[
["Blocky Crown","👑",250,"hats"],
["Blue Cap","🧢",100,"hats"],
["Golden Top Hat","🎩",500,"hats"],
["Wizard Hat","🧙",350,"hats"],
["Cool Shades","🕶️",150,"faces"],
["Happy Face","😀",75,"faces"],
["Sleepy Face","😴",90,"faces"],
["Red Hoodie","👕",200,"shirts"],
["Blue Shirt","👕",125,"shirts"],
["Green Shirt","👕",100,"shirts"],
["Purple Shirt","👕",175,"shirts"],
["Black Pants","👖",150,"pants"],
["Blue Pants","👖",125,"pants"],
["Blocky Jeans","👖",200,"pants"],
["Golden Crown","👑",1000,"hats"],
["Galaxy Hat","🌌",750,"hats"]
];

let currentAccount=localStorage.getItem("bloxplay_current")||"Player";
let accounts=JSON.parse(localStorage.getItem("bloxplay_accounts")||"[]");

if(!accounts.length){
 accounts=[{
  username:"Player",
  password:"",
  avatar:{
   skin:"#f1c27d",
   shirt:"#238636",
   pants:"#30363d",
   items:[]
  },
  friends:[]
 }];
 save();
}

let selectedCategory="all";

function save(){
 localStorage.setItem("bloxplay_accounts",JSON.stringify(accounts));
 localStorage.setItem("bloxplay_current",currentAccount);
}

function account(){
 return accounts.find(a=>a.username===currentAccount)||accounts[0];
}

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");

 if(id==="shop")renderShop();
 if(id==="inventory")renderInventory();
 if(id==="avatar")renderAvatar();
 if(id==="accounts")renderAccounts();
 if(id==="friends")renderFriends();
 if(id==="games")renderGames();
}

window.showPage=showPage;

function renderGames(){

 const q=(document.getElementById("gameSearch")?.value||"").toLowerCase();

 const html=games
 .filter(g=>g[0].toLowerCase().includes(q))
 .map(g=>`
 <div class="game">
  <div class="thumb">${g[1]}</div>
  <div class="info">
   <h3>${g[0]}</h3>
   <p>${g[2]}</p>
   <button onclick="openGame('${g[3]}','${g[0]}')">PLAY</button>
  </div>
 </div>`).join("");

 document.getElementById("gamesGrid").innerHTML=html;

 document.getElementById("homeGames").innerHTML=
 games.slice(0,8).map(g=>`
 <div class="game">
  <div class="thumb">${g[1]}</div>
  <div class="info">
   <h3>${g[0]}</h3>
   <button onclick="openGame('${g[3]}','${g[0]}')">PLAY</button>
  </div>
 </div>`).join("");
}

window.renderGames=renderGames;

function shopCategory(cat,button){

 selectedCategory=cat;

 document.querySelectorAll(".shopTabs button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 renderShop();
}

window.shopCategory=shopCategory;

function renderShop(){

 const q=(document.getElementById("shopSearch")?.value||"").toLowerCase();
 const owned=account().avatar.items||[];

 const filtered=items.filter(i=>
  (selectedCategory==="all"||i[3]===selectedCategory)&&
  i[0].toLowerCase().includes(q)
 );

 document.getElementById("shopGrid").innerHTML=
 filtered.map((i,index)=>{

  const id=items.indexOf(i);
  const has=owned.includes(id);

  return `
  <div class="item">
   <div class="itemIcon">${i[1]}</div>
   <div class="itemInfo">
    <h3>${i[0]}</h3>
    <div class="price">🪙 ${i[2]}</div>
    <br>
    ${
     has
     ? `<div class="owned">OWNED</div>`
     : `<button onclick="buyItem(${id})">BUY</button>`
    }
   </div>
  </div>`;
 }).join("");
}

window.renderShop=renderShop;

function buyItem(id){

 const item=items[id];
 const a=account();

 a.avatar.items=a.avatar.items||[];

 if(a.avatar.items.includes(id)){
  alert("You already own this item.");
  return;
 }

 if(item[2]>0){
  a.avatar.items.push(id);
  save();
  renderShop();
  renderInventory();
  alert(`${item[0]} added to your inventory!`);
 }
}

window.buyItem=buyItem;

function renderInventory(){

 const owned=account().avatar.items||[];

 if(!owned.length){
  document.getElementById("inventoryGrid").innerHTML=
  `<div class="card"><h3>Your inventory is empty.</h3></div>`;
  return;
 }

 document.getElementById("inventoryGrid").innerHTML=
 owned.map(id=>{

  const i=items[id];

  return `
  <div class="item">
   <div class="itemIcon">${i[1]}</div>
   <div class="itemInfo">
    <h3>${i[0]}</h3>
    <div class="owned">OWNED</div>
    <br>
    <button onclick="equipItem(${id})">EQUIP</button>
   </div>
  </div>`;
 }).join("");
}

window.renderInventory=renderInventory;

function equipItem(id){

 const i=items[id];
 const a=account();

 if(i[3]==="shirts"){
  const colors={
   "Red Hoodie":"#d1242f",
   "Blue Shirt":"#1f6feb",
   "Green Shirt":"#238636",
   "Purple Shirt":"#8957e5"
  };
  a.avatar.shirt=colors[i[0]]||a.avatar.shirt;
 }

 if(i[3]==="pants"){
  a.avatar.pants=i[0].includes("Black")?"#111827":"#2563eb";
 }

 save();
 renderAvatar();
 alert(`${i[0]} equipped!`);
}

window.equipItem=equipItem;

function renderAvatar(){

 const a=account();

 const equipped=(a.avatar.items||[])
 .map(id=>items[id]);

 const hat=equipped.find(i=>i[3]==="hats");

 document.getElementById("avatarPreview").innerHTML=`
 <div class="avatar3d">

  ${hat?`<div style="
   position:absolute;top:-25px;left:5px;width:80px;height:25px;
   background:#ffd33d;border-radius:8px;text-align:center;
   font-size:22px;z-index:4">${hat[1]}</div>`:""}

  <div class="aHead" style="background:${a.avatar.skin}">
   ${equipped.find(i=>i[3]==="faces")?.[1]||""}
  </div>

  <div class="aBody" style="background:${a.avatar.shirt}"></div>

  <div class="aArm l" style="background:${a.avatar.skin}"></div>
  <div class="aArm r" style="background:${a.avatar.skin}"></div>

  <div class="aLeg l" style="background:${a.avatar.pants||"#30363d"}"></div>
  <div class="aLeg r" style="background:${a.avatar.pants||"#30363d"}"></div>

 </div>`;
}

window.renderAvatar=renderAvatar;

function setSkin(c){
 account().avatar.skin=c;
 save();
 renderAvatar();
}

function setShirt(c){
 account().avatar.shirt=c;
 save();
 renderAvatar();
}

window.setSkin=setSkin;
window.setShirt=setShirt;

function renderAccounts(){

 document.getElementById("accountArea").innerHTML=`

 <p>Current account: <b>${currentAccount}</b></p>

 <div class="row">
 ${
 accounts.map(a=>
 `<button onclick="switchAccount('${a.username}')">
 ${a.username}
 </button>`).join("")
 }
 </div>

 <hr>

 <h3>Create Account</h3>

 <input id="newUser" placeholder="Username">
 <input id="newPass" type="password" placeholder="Password">

 <button onclick="createAccount()">CREATE ACCOUNT</button>
 `;
}

function createAccount(){

 if(accounts.length>=5){
  alert("Maximum 5 accounts.");
  return;
 }

 const u=document.getElementById("newUser").value.trim();
 const p=document.getElementById("newPass").value;

 if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){
  alert("Username must be 3-20 letters, numbers, or underscores.");
  return;
 }

 if(/admin|owner|roblox|bloxplay/i.test(u)){
  alert("That username is not allowed.");
  return;
 }

 if(accounts.some(a=>a.username.toLowerCase()===u.toLowerCase())){
  alert("Username already exists.");
  return;
 }

 accounts.push({
  username:u,
  password:p,
  avatar:{
   skin:"#f1c27d",
   shirt:"#238636",
   pants:"#30363d",
   items:[]
  },
  friends:[]
 });

 currentAccount=u;
 save();
 renderAccounts();
 renderAvatar();
}

window.createAccount=createAccount;

function switchAccount(u){
 currentAccount=u;
 save();
 renderAccounts();
 renderAvatar();
 renderFriends();
}

window.switchAccount=switchAccount;

function renderFriends(){

 const f=account().friends||[];

 document.getElementById("friendsList").innerHTML=
 f.length
 ? f.map(x=>`<div class="card">${x}</div>`).join("")
 : `<p>No friends yet.</p>`;
}

function addFriend(){

 const input=document.getElementById("friendInput");
 const name=input.value.trim();

 if(!name)return;

 const a=account();
 a.friends=a.friends||[];

 if(!a.friends.includes(name)){
  a.friends.push(name);
 }

 input.value="";
 save();
 renderFriends();
}

window.addFriend=addFriend;


/* =========================
   3D GAME SYSTEM
========================= */

let scene;
let camera;
let renderer;
let player;
let clock;
let running=false;
let gameType="";
let cameraYaw=0;
let cameraPitch=.3;
let velocityY=0;
let grounded=true;
let joystickX=0;
let joystickY=0;
let keys={};
let objects=[];
let score=0;
let timeLeft=120;
let timer;

const canvas=document.getElementById("gameCanvas");

function openGame(type,title){

 document.getElementById("gameScreen").style.display="block";
 document.getElementById("gameTitle").textContent=title;

 gameType=type;

 startGame();
}

window.openGame=openGame;

function closeGame(){

 running=false;
 clearInterval(timer);

 document.getElementById("gameScreen").style.display="none";
}

window.closeGame=closeGame;

function startGame(){

 running=true;
 score=0;
 timeLeft=120;
 objects=[];

 scene=new THREE.Scene();

 scene.background=new THREE.Color(
  gameType==="space"?0x050816:
  gameType==="snow"?0xcce8ff:
  gameType==="volcano"?0x24100c:
  0x78c6ff
 );

 camera=new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .1,
  1000
 );

 renderer=new THREE.WebGLRenderer({
  canvas,
  antialias:true
 });

 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);

 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(30,50,20);
 scene.add(sun);

 createWorld();
 createPlayer();

 document.getElementById("gameMessage").textContent=
 "WASD / joystick • Drag to look • Jump";

 clearInterval(timer);

 timer=setInterval(()=>{

  if(!running)return;

  timeLeft--;

  updateStats();

  if(timeLeft<=0){
   finishGame();
  }

 },1000);

 animate();
}

function updateStats(){

 document.getElementById("gameStats").textContent=
 `🪙 ∞   ⭐ ${score}   ⏱️ ${timeLeft}`;
}

function createWorld(){

 const groundColor=
 gameType==="snow"?0xe8f5ff:
 gameType==="farm"?0x58953d:
 gameType==="space"?0x171c30:
 gameType==="volcano"?0x4c2116:
 0x4c9a49;

 const ground=new THREE.Mesh(
  new THREE.BoxGeometry(240,1,240),
  new THREE.MeshStandardMaterial({color:groundColor})
 );

 ground.position.y=-.5;
 scene.add(ground);

 if(gameType==="race"||gameType==="speed"){
  const road=new THREE.Mesh(
   new THREE.BoxGeometry(25,.15,220),
   new THREE.MeshStandardMaterial({color:0x30343b})
  );

  road.position.y=.05;
  scene.add(road);

  for(let z=-100;z<100;z+=12){
   const line=new THREE.Mesh(
    new THREE.BoxGeometry(1,.2,6),
    new THREE.MeshStandardMaterial({color:0xffffff})
   );
   line.position.set(0,.15,z);
   scene.add(line);
  }
 }

 for(let i=0;i<35;i++){

  const x=(Math.random()-.5)*180;
  const z=(Math.random()-.5)*180;

  if(gameType!=="space"&&gameType!=="city"){
   createTree(x,z);
  }else{
   createBuilding(x,z);
  }
 }

 const collectible=[
  "coins","grab","island","farm","pets",
  "factory","ghost","sky","treasure",
  "snow","space","zoo","mystery"
 ];

 if(collectible.includes(gameType)){

  for(let i=0;i<45;i++){

   const color=
    gameType==="coins"?0xffd33d:
    gameType==="ghost"?0x9b59ff:
    gameType==="treasure"?0x00d084:
    0x00aaff;

   const object=new THREE.Mesh(
    new THREE.BoxGeometry(1.2,1.2,1.2),
    new THREE.MeshStandardMaterial({
     color,
     emissive:color,
     emissiveIntensity:.2
    })
   );

   object.position.set(
    (Math.random()-.5)*180,
    1,
    (Math.random()-.5)*180
   );

   scene.add(object);
   objects.push(object);
  }
 }
}

function createPlayer(){

 const a=account().avatar;

 player=new THREE.Group();

 const skin=new THREE.MeshStandardMaterial({
  color:a.skin
 });

 const shirt=new THREE.MeshStandardMaterial({
  color:a.shirt
 });

 const pants=new THREE.MeshStandardMaterial({
  color:a.pants||0x30363d
 });

 const head=new THREE.Mesh(
  new THREE.BoxGeometry(1.15,1.15,1.15),
  skin
 );
 head.position.y=3.5;
 player.add(head);

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(1.35,1.6,.8),
  shirt
 );
 body.position.y=2.15;
 player.add(body);

 const arm1=new THREE.Mesh(
  new THREE.BoxGeometry(.45,1.5,.45),
  skin
 );
 arm1.position.set(-.9,2.2,0);
 player.add(arm1);

 const arm2=arm1.clone();
 arm2.position.x=.9;
 player.add(arm2);

 const leg1=new THREE.Mesh(
  new THREE.BoxGeometry(.5,1.5,.5),
  pants
 );
 leg1.position.set(-.38,.7,0);
 player.add(leg1);

 const leg2=leg1.clone();
 leg2.position.x=.38;
 player.add(leg2);

 player.position.set(0,0,25);

 scene.add(player);
}

function createTree(x,z){

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.5,.7,4,8),
  new THREE.MeshStandardMaterial({color:0x7b4f2a})
 );

 trunk.position.set(x,2,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.7,10,8),
  new THREE.MeshStandardMaterial({color:0x1f8a43})
 );

 leaves.position.set(x,5,z);
 scene.add(leaves);
}

function createBuilding(x,z){

 const h=5+Math.random()*15;

 const building=new THREE.Mesh(
  new THREE.BoxGeometry(7,h,7),
  new THREE.MeshStandardMaterial({color:0x59636e})
 );

 building.position.set(x,h/2,z);

 scene.add(building);
}

function movePlayer(dt){

 let forward=0;
 let side=0;

 if(keys.KeyW)forward++;
 if(keys.KeyS)forward--;
 if(keys.KeyA)side--;
 if(keys.KeyD)side++;

 forward+=joystickY;
 side+=joystickX;

 const length=Math.hypot(forward,side);

 if(length>1){
  forward/=length;
  side/=length;
 }

 const speed=10;

 const forwardX=Math.sin(cameraYaw);
 const forwardZ=Math.cos(cameraYaw);

 const rightX=Math.cos(cameraYaw);
 const rightZ=-Math.sin(cameraYaw);

 const moveX=
  forwardX*forward+
  rightX*side;

 const moveZ=
  forwardZ*forward+
  rightZ*side;

 player.position.x+=moveX*speed*dt;
 player.position.z+=moveZ*speed*dt;

 if(Math.abs(moveX)+Math.abs(moveZ)>.05){
  player.rotation.y=Math.atan2(moveX,moveZ);
 }

 velocityY-=22*dt;
 player.position.y+=velocityY*dt;

 if(player.position.y<=0){

  player.position.y=0;
  velocityY=0;
  grounded=true;
 }

 const distance=9;

 const cameraX=
  player.position.x-
  Math.sin(cameraYaw)*distance;

 const cameraZ=
  player.position.z-
  Math.cos(cameraYaw)*distance;

 const cameraY=
  player.position.y+
  4.5+
  Math.sin(cameraPitch)*4;

 camera.position.lerp(
  new THREE.Vector3(cameraX,cameraY,cameraZ),
  .12
 );

 camera.lookAt(
  player.position.x,
  player.position.y+2,
  player.position.z
 );

 collectObjects();
}

function collectObjects(){

 for(let i=objects.length-1;i>=0;i--){

  const object=objects[i];

  object.rotation.y+=.04;

  const distance=
   object.position.distanceTo(player.position);

  if(distance<2.5){

   scene.remove(object);
   objects.splice(i,1);

   score++;

   updateStats();

   document.getElementById("gameMessage").textContent=
   `Collected! Score: ${score}`;
  }
 }
}

function jump(){

 if(!grounded)return;

 velocityY=9;
 grounded=false;
}

function gameAction(){

 score++;
 updateStats();

 document.getElementById("gameMessage").textContent=
 "ACTION COMPLETE! ⭐ "+score;
}

function finishGame(){

 running=false;
 clearInterval(timer);

 document.getElementById("gameMessage").textContent=
 `GAME COMPLETE! ⭐ ${score}`;

 setTimeout(()=>{

  if(document.getElementById("gameScreen").style.display!=="none"){
   startGame();
  }

 },2500);
}

function animate(){

 if(!running)return;

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 movePlayer(dt);

 objects.forEach((o,i)=>{
  o.position.y=
   1+Math.sin(performance.now()/350+i)*.2;
 });

 renderer.render(scene,camera);
}


/* Keyboard */

window.addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(e.code==="Space"){
  jump();
 }
});

window.addEventListener("keyup",e=>{
 keys[e.code]=false;
});


/* Jump */

document.getElementById("jumpBtn").addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  jump();
 }
);


/* Action */

document.getElementById("actionBtn").addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  gameAction();
 }
);


/* Joystick */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("joystickStick");

joystick.addEventListener("pointerdown",e=>{
 e.preventDefault();
 joystick.setPointerCapture(e.pointerId);
 moveJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
 if(e.buttons)moveJoystick(e);
});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

function moveJoystick(e){

 const rect=joystick.getBoundingClientRect();

 const centerX=rect.left+rect.width/2;
 const centerY=rect.top+rect.height/2;

 let x=(e.clientX-centerX)/48;
 let y=(e.clientY-centerY)/48;

 const length=Math.hypot(x,y);

 if(length>1){
  x/=length;
  y/=length;
 }

 joystickX=x;
 joystickY=-y;

 stick.style.transform=
 `translate(${x*35}px,${y*35}px)`;
}

function resetJoystick(){

 joystickX=0;
 joystickY=0;

 stick.style.transform="translate(0,0)";
}


/* Camera */

let looking=false;
let lastX=0;
let lastY=0;

canvas.addEventListener("pointerdown",e=>{

 looking=true;

 lastX=e.clientX;
 lastY=e.clientY;

 canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{

 if(!looking)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 lastX=e.clientX;
 lastY=e.clientY;

 cameraYaw-=dx*.006;
 cameraPitch-=dy*.004;

 cameraPitch=
 Math.max(-.35,Math.min(1.1,cameraPitch));
});

canvas.addEventListener("pointerup",()=>{
 looking=false;
});

canvas.addEventListener("pointercancel",()=>{
 looking=false;
});


window.addEventListener("resize",()=>{

 if(!camera||!renderer)return;

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});


renderGames();
renderShop();
renderInventory();
renderAvatar();
renderAccounts();
renderFriends();

</script>
</body>
</html>
