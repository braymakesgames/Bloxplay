<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BlockPlay</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10131a;
  color: white;
}

header {
  background: #181d27;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

nav button {
  background: #303847;
  color: white;
  border: 0;
  padding: 9px;
  margin: 2px;
  border-radius: 8px;
}

.page {
  padding: 25px;
}

.hidden {
  display: none;
}

.card {
  background: #1b212c;
  padding: 20px;
  border-radius: 15px;
  margin-top: 15px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #444;
  background: #10131a;
  color: white;
}

button {
  cursor: pointer;
}

.primary {
  background: #4da3ff;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
}

.account {
  background: #292f3b;
  padding: 12px;
  margin-top: 8px;
  border-radius: 9px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.account button {
  background: #4da3ff;
  color: white;
  border: 0;
  padding: 8px;
  border-radius: 7px;
}

.error {
  color: #ff7070;
}
</style>
</head>

<body>

<header>

<div class="logo">🧱 BlockPlay</div>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('accounts')">Accounts</button>
<button onclick="showPage('avatar')">Avatar</button>
<button onclick="showPage('games')">My Games</button>
</nav>

</header>

<section id="home" class="page">

<h1>Make. Play. Create.</h1>

<p id="welcome">
Welcome to BlockPlay!
</p>

<button class="primary" onclick="showPage('create')">
Create Game
</button>

<div class="card">

<h2>🎮 Featured Games</h2>

<p>🏝️ Island Survival</p>
<p>🏎️ Block Racers</p>
<p>👻 Ghost Hunt</p>
<p>💰 Coin Rush</p>
<p>🏗️ Build City</p>

</div>

</section>


<section id="accounts" class="page hidden">

<div class="card">

<h1>👤 Accounts</h1>

<p id="current">
No account selected.
</p>

<input
id="username"
maxlength="16"
placeholder="Username"
>

<p id="error" class="error"></p>

<button
class="primary"
onclick="createAccount()">
Create Account
</button>

<div id="accountList"></div>

</div>

</section>


<section id="avatar" class="page hidden">

<div class="card">

<h1>🧍 Avatar</h1>

<div style="font-size:100px;text-align:center;">
🧍
</div>

<p>
Your avatar will be saved to the account you're using.
</p>

</div>

</section>


<section id="create" class="page hidden">

<div class="card">

<h1>🎮 Create Game</h1>

<input
id="gameName"
placeholder="Game name"
maxlength="30"
>

<button
class="primary"
onclick="createGame()">
Create
</button>

</div>

</section>


<section id="games" class="page hidden">

<div class="card">

<h1>🎮 My Games</h1>

<div id="myGames">
No games yet.
</div>

</div>

</section>


<script>

let accounts =
JSON.parse(
localStorage.getItem("blockplayAccounts") || "{}"
);

let currentAccount =
localStorage.getItem("blockplayCurrentAccount") || "";

const blockedWords = [
"badword",
"admin",
"moderator"
];


function save() {

localStorage.setItem(
"blockplayAccounts",
JSON.stringify(accounts)
);

if (currentAccount) {

localStorage.setItem(
"blockplayCurrentAccount",
currentAccount
);

}

}


function showPage(page) {

document
.querySelectorAll(".page")
.forEach(function(p) {

p.classList.add("hidden");

});

document
.getElementById(page)
.classList.remove("hidden");

if (page === "accounts") {
updateAccounts();
}

if (page === "games") {
updateGames();
}

}


function createAccount() {

let input =
document.getElementById("username");

let error =
document.getElementById("error");

let name =
input.value
.trim()
.replace(/[^a-zA-Z0-9_]/g, "");

error.textContent = "";

if (name.length < 3) {

error.textContent =
"Username must be at least 3 characters.";

return;

}


let lower =
name.toLowerCase();

for (let word of blockedWords) {

if (lower.includes(word)) {

error.textContent =
"That username is not allowed.";

return;

}

}


if (accounts[name]) {

error.textContent =
"That account already exists.";

return;

}


accounts[name] = {

username: name,

games: [],

avatar: {

skin: "#ffd2a6",

shirt: "#4da3ff",

pants: "#303030"

}

};


currentAccount = name;

save();

input.value = "";

updateAccounts();

updateWelcome();

}


function switchAccount(name) {

currentAccount = name;

save();

updateAccounts();

updateWelcome();

alert(
"Switched to " + name
);

}


function deleteAccount(name) {

delete accounts[name];

if (currentAccount === name) {

let names =
Object.keys(accounts);

currentAccount =
names.length > 0
? names[0]
: "";

}

save();

updateAccounts();

updateWelcome();

}


function updateAccounts() {

let list =
document.getElementById("accountList");

let current =
document.getElementById("current");

if (currentAccount) {

current.textContent =
"Current account: " +
currentAccount;

} else {

current.textContent =
"No account selected.";

}


list.innerHTML = "";

Object.keys(accounts)
.forEach(function(name) {

let div =
document.createElement("div");

div.className = "account";

div.innerHTML =
"<strong>👤 " +
escapeHTML(name) +
"</strong>";

let buttons =
document.createElement("div");

let switchButton =
document.createElement("button");

switchButton.textContent =
"Switch";

switchButton.onclick =
function() {

switchAccount(name);

};


let deleteButton =
document.createElement("button");

deleteButton.textContent =
"Delete";

deleteButton.style.marginLeft =
"5px";

deleteButton.style.background =
"#a33";

deleteButton.onclick =
function() {

deleteAccount(name);

};


buttons.appendChild(
switchButton
);

buttons.appendChild(
deleteButton
);

div.appendChild(buttons);

list.appendChild(div);

});

}


function updateWelcome() {

let welcome =
document.getElementById("welcome");

if (currentAccount) {

welcome.textContent =
"Welcome, " +
currentAccount +
"!";

} else {

welcome.textContent =
"Welcome to BlockPlay!";

}

}


function createGame() {

if (!currentAccount) {

alert(
"Create an account first."
);

showPage("accounts");

return;

}


let input =
document.getElementById("gameName");

let name =
input.value.trim();

if (!name) {

alert(
"Enter a game name."
);

return;

}


accounts[currentAccount]
.games
.push(name);

save();

input.value = "";

updateGames();

alert(
"Game created!"
);

}


function updateGames() {

let box =
document.getElementById("myGames");

if (!currentAccount) {

box.textContent =
"Create an account first.";

return;

}


let games =
accounts[currentAccount].games;

if (games.length === 0) {

box.textContent =
"No games yet.";

return;

}


box.innerHTML = "";

games.forEach(function(game) {

let p =
document.createElement("p");

p.textContent =
"🎮 " + game;

box.appendChild(p);

});

}


function escapeHTML(text) {

return text
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


updateAccounts();

updateWelcome();

updateGames();

</script>

</body>
</html>
